---
name: "brAIn"
description: "Give your smart home a mind — Claude with full run of Home Assistant: every entity, device, area, dashboard and automation, plus insights, findings, memory, voice and a terminal"
version: "1.19.2"
slug: "brain"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/brain"

# Web interface configuration.
#
# ONE ingress panel serves everything: the aiohttp panel on 8099 is the
# ingress target, and it reverse-proxies /terminal/ through to ttyd on
# 7681 (HTTP + WebSocket) so the terminal is a tab rather than a second
# add-on. 7681 is declared below but no longer published by default — see
# the note on `ports`.
ingress: true
ingress_port: 8099
# The sidebar icon has to be an MDI name — Home Assistant won't take custom
# artwork here — so it can only ever rhyme with the mark, never be it. It says
# what the add-on is instead: brAIn is the mind you gave the house, so it is a
# brain. `mdi:home-analytics` said dashboard, which is one tab of five.
panel_icon: mdi:brain
panel_title: "brAIn"
panel_admin: true

# Declared but NOT published by default (`null`).
#
# ttyd is a shell with /config read-write and a signed-in Claude Code
# behind it. Published, it answered to anything on the LAN — no Home
# Assistant login involved — which is the exposure Home Assistant wrote up
# in GHSA-gh5m-4m97-c95h. Ingress does not need this port (the panel
# reverse-proxies /terminal/ to ttyd over loopback), so the default is off
# and a user who wants a kiosk assigns a port in the Network panel.
#
# ttyd requires HTTP Basic auth either way now: run.sh generates the
# password into /data/terminal-credential and the panel presents it
# upstream, so turning the port on is no longer the same as turning
# authentication off.
ports:
  7681/tcp: null
ports_description:
  7681/tcp: "Web terminal, direct access (off by default; password-protected, not required for ingress)"

# Restart the add-on if the panel stops answering. The panel is the
# ingress target and the foreground process, so a hung panel is a dead
# add-on that still looks "started" in the Supervisor.
watchdog: "http://[HOST]:[PORT:8099]/api/health"

# Keep the Claude OAuth credential out of Home Assistant backups.
#
# /data persists the signed-in Claude Code session. HA backups are not
# encrypted unless the user opts in, and they get copied to cloud storage,
# NAS shares and support tickets — an account credential should not ride
# along. Losing it on restore costs one sign-in.
backup_exclude:
  - .config/claude/**
  - home/.claude/**
  - terminal-credential
  - chat_transcript.json

# Lifecycle stage, declared rather than inherited from the default.
stage: stable
boot: auto

# The panel writes options back through the Supervisor and reads the
# add-on/registry APIs that landed in 2023.x.
homeassistant: "2023.6.0"

# App configuration options.
#
# The insight options (refresh, history, model, timeout) are also editable
# from the panel's Settings dialog; the panel writes changes back here
# through the Supervisor, so both screens show the same value.
options:
  enable_terminal: true
  enable_insights: true
  auto_launch_claude: true
  auto_generate_context: true
  enable_ha_mcp_server: true
  enable_assist_integration: true
  enable_automation_integration: true
  enable_mobile_ui: true
  dangerously_skip_permissions: false
  assist_fast_mode: true
  assist_tool_access: mcp_only
  assist_max_turns: 8
  automation_max_turns: 30
  study_max_turns: 60
  study_timeout_minutes: 30
  learning: true
  memory_injection: true
  memory_max_kb: 32
  edit_journal_days: 14
  auto_refresh_hours: 24
  history_days: 7
  history_keep_runs: 40
  history_keep_days: 30
  model: ""
  generation_timeout_minutes: 8
  access_share: true
  access_media: true
  access_backup: true
  access_addon_configs: true
  access_addons: true
  additional_directories: []
  persistent_apk_packages: []
  persistent_pip_packages: []
  log_level: info
schema:
  enable_terminal: bool?
  enable_insights: bool?
  auto_launch_claude: bool?
  auto_generate_context: bool?
  enable_ha_mcp_server: bool?
  enable_assist_integration: bool?
  enable_automation_integration: bool?
  enable_mobile_ui: bool?
  dangerously_skip_permissions: bool?
  assist_fast_mode: bool?
  assist_tool_access: "list(mcp_only|full)?"
  assist_max_turns: "int(1,40)?"
  automation_max_turns: "int(1,200)?"
  study_max_turns: "int(0,500)?"
  study_timeout_minutes: "int(2,120)?"
  learning: bool?
  memory_injection: bool?
  memory_max_kb: "int(1,64)?"
  edit_journal_days: "int(0,365)?"
  auto_refresh_hours: "int(0,168)?"
  history_days: "int(1,30)?"
  history_keep_runs: "int(0,200)?"
  history_keep_days: "int(0,365)?"
  model: "str?"
  generation_timeout_minutes: "int(2,30)?"
  access_share: bool?
  access_media: bool?
  access_backup: bool?
  access_addon_configs: bool?
  access_addons: bool?
  additional_directories:
    - str
  persistent_pip_packages:
    - str
  persistent_apk_packages:
    - str
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"

# Volume mappings for file access. The Home Assistant config directory uses
# the current `homeassistant_config` type (the legacy `config` alias is no
# longer documented) with an explicit /config path so every script keeps its
# long-standing mount point.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - share:rw
  - media:rw
  - backup:ro
  - all_addon_configs:rw
  - addons:rw

# API access for Home Assistant integration
hassio_api: true
hassio_role: admin
homeassistant_api: true
auth_api: true

# Auto-discovery: registers "brain" with the Supervisor so HA Core can
# auto-discover and offer to set up the companion integration
discovery:
  - brain

# Service startup configuration
startup: services

# No `webui:`. It pointed at http://[HOST]:[PORT:7681]/ — the raw ttyd
# port, which is now unpublished by default, so the button would have led
# somewhere nothing was listening. Ingress is the way in, and the sidebar
# panel is already that button.
