  primary-text-color: "#F1F2F3"
  secondary-text-color: "#C6CCD3"
  disabled-text-color: "#7D858F"
  divider-color: "rgba(255,255,255,.1)"
  primary-color: "#A9B4F2"
  accent-color: "#F5C27F"
  app-header-background-color: "#2A2D31"
  app-header-text-color: "#F1F2F3"
  sidebar-background-color: "#25282C"
  sidebar-text-color: "#F1F2F3"
  sidebar-icon-color: "#C6CCD3"
  morph-quiet: "#B8BFC8"
  morph-ink: "#15120D"
  morph-amber: "#F5C27F"
  morph-sand: "#E6D3AC"
  morph-sky: "#A7C8F2"
