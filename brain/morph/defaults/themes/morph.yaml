# Morph's three looks as Home Assistant themes. brAIn put this file here
# once and never overwrites it: it is this house's to change (by a Tell, in
# a chat, or by hand), and every change is a commit in /config/morph.
# Pick a theme in your profile, per view (`theme:` on a view), or for the
# whole house (frontend.set_theme). Every Morph card reads these through
# Home Assistant's theme variables, and so does every other card.
Morph:
  ha-card-border-radius: 18px
  ha-card-box-shadow: none
  modes:
    light:
      primary-background-color: "#ECEBE6"
      secondary-background-color: "#E4E3DD"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      primary-text-color: "#16181B"
      secondary-text-color: "#535A63"
      disabled-text-color: "#8A9098"
      divider-color: "rgba(22,24,27,.1)"
      primary-color: "#4F5FC4"
      accent-color: "#935C14"
      app-header-background-color: "#ECEBE6"
      app-header-text-color: "#16181B"
      sidebar-background-color: "#E4E3DD"
      sidebar-text-color: "#16181B"
      sidebar-icon-color: "#535A63"
      morph-quiet: "#575E67"
      morph-ink: "#FFFFFF"
      morph-amber: "#935C14"
      morph-sand: "#7D6630"
      morph-sky: "#3168B2"
      morph-violet: "#7053CD"
      morph-teal: "#13746C"
      morph-lime: "#527313"
      morph-rose: "#B44333"
      morph-peach: "#9E5428"
      morph-indigo: "#4F5FC4"
    dark:
      primary-background-color: "#0A0C0E"
      secondary-background-color: "#0F1114"
      card-background-color: "#15181B"
      ha-card-background: "#15181B"
      primary-text-color: "#EDEFF1"
      secondary-text-color: "#A0A9B3"
      disabled-text-color: "#6B737D"
      divider-color: "rgba(255,255,255,.08)"
      primary-color: "#9DAAF5"
      accent-color: "#F4B969"
      app-header-background-color: "#0A0C0E"
      app-header-text-color: "#EDEFF1"
      sidebar-background-color: "#0F1114"
      sidebar-text-color: "#EDEFF1"
      sidebar-icon-color: "#A0A9B3"
      morph-quiet: "#8E97A2"
      morph-ink: "#15120D"
      morph-amber: "#F4B969"
      morph-sand: "#E9D3A6"
      morph-sky: "#9CC2F5"
      morph-violet: "#BBA6F2"
      morph-teal: "#63CCC2"
      morph-lime: "#BCD873"
      morph-rose: "#F2907F"
      morph-peach: "#F2B590"
      morph-indigo: "#9DAAF5"
Morph Medium:
  ha-card-border-radius: 18px
  ha-card-box-shadow: none
  primary-background-color: "#2A2D31"
  secondary-background-color: "#25282C"
  card-background-color: "#34383D"
