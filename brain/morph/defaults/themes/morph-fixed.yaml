# Morph's light and dark looks, each ALONE, for a view or a person that
# chose one: "Morph" follows the person's own light/dark setting, and a
# house whose Morph dashboard was dark has to stay dark whatever a profile
# says. The same colours as the two modes of "Morph" in morph.yaml (a test
# holds them equal). brAIn put this file here once and never overwrites it.
Morph Light:
  ha-card-border-radius: 18px
  ha-card-box-shadow: none
  primary-background-color: "#ECEBE6"
  secondary-background-color: "#E4E3DD"
  card-background-color: "#FFFFFF"
  ha-card-background: "#FFFFFF"
  primary-text-color: "#16181B"
  secondary-text-color: "#535A63"
  disabled-text-color: "#8A9098"
  divider-color: "rgba(22,24,27,.1)"
  primary-color: "#4F5FC4"
  accent-color: "#C27A1A"
  app-header-background-color: "#ECEBE6"
  app-header-text-color: "#16181B"
  sidebar-background-color: "#E4E3DD"
  sidebar-text-color: "#16181B"
  sidebar-icon-color: "#535A63"
  morph-quiet: "#5B636C"
  morph-ink: "#FFFFFF"
  morph-amber: "#C27A1A"
  morph-sand: "#9C7F3C"
  morph-sky: "#3B78C9"
  morph-violet: "#7A5FD0"
  morph-teal: "#178A80"
  morph-lime: "#5E8416"
  morph-rose: "#C9503F"
  morph-peach: "#B8622F"
  morph-indigo: "#4F5FC4"
Morph Dark:
  ha-card-border-radius: 18px
  ha-card-box-shadow: none
  primary-background-color: "#0A0C0E"
  secondary-background-color: "#0F1114"
  card-background-color: "#15181B"
  ha-card-background: "#15181B"
  primary-text-color: "#EDEFF1"
  secondary-text-color: "#A0A9B3"
  disabled-text-color: "#6B737D"
  divider-color: "rgba(255,255,255,.08)"
  primary-color: "#9DAAF5"
  accent-color: "#F4B969"
  app-header-background-color: "#0A0C0E"
  app-header-text-color: "#EDEFF1"
  sidebar-background-color: "#0F1114"
  sidebar-text-color: "#EDEFF1"
  sidebar-icon-color: "#A0A9B3"
  morph-quiet: "#808994"
  morph-ink: "#15120D"
  morph-amber: "#F4B969"
  morph-sand: "#E9D3A6"
  morph-sky: "#9CC2F5"
  morph-violet: "#BBA6F2"
  morph-teal: "#63CCC2"
  morph-lime: "#BCD873"
  morph-rose: "#F2907F"
  morph-peach: "#F2B590"
  morph-indigo: "#9DAAF5"
