---
name: "BRUH Minecraft Server"
description: "Rock-solid Minecraft Java Edition server with ingress panel, RCON, git world backups, auto-updates, plugin management, and deep Home Assistant integration"
version: "1.2.7"
slug: "bruh_minecraft_server"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bruh-minecraft-server"

# AppArmor profile
apparmor: false

# Boot policy
boot: auto
startup: services
stage: stable

# Web interface configuration (ingress panel)
ingress: true
ingress_port: 8099
panel_icon: mdi:minecraft
panel_title: "Minecraft"
panel_admin: true

# Minecraft networking
# host_network: true is REQUIRED for Bedrock LAN discovery — iOS, Android,
# consoles, and Win10/11 find local servers via UDP multicast/broadcast on
# port 19132, and Docker's bridge network drops those packets. With host
# networking the container shares the HA host's network stack directly, so:
#   * Bedrock LAN pings reach the server and the world shows up in the
#     "Friends" tab of Minecraft Bedrock without manual IP entry.
#   * All ports below bind directly to the host (no Docker NAT translation).
# Ingress (the management panel) still works because the Supervisor proxies
# it over a unix socket, not a TCP port.
host_network: true
ports:
  25565/tcp: 25565
  25565/udp: 25565
  19132/udp: 19132
  24454/udp: 24454
ports_description:
  25565/tcp: "Minecraft Java Edition (TCP)"
  25565/udp: "Minecraft Java Edition (UDP)"
  19132/udp: "Minecraft Bedrock / Geyser (optional)"
  24454/udp: "Simple Voice Chat (optional)"

# App configuration options
options:
  eula: false
  # active_world: which saved server profile is currently live. Each profile
  # lives at /config/minecraft-worlds/<name>/ with its own world folder,
  # server.properties, plugins, and backup history. Use the panel's "Worlds"
  # tab (or the world-manager.sh CLI) to create, switch, and delete profiles.
  # Changing this option + restarting the add-on flips the active world.
  # The legacy /config/minecraft/ directory migrates to "default" on first
  # boot of 1.3.0, so existing installs keep their world unchanged.
  active_world: default
  server_type: paper
  minecraft_version: LATEST
  motd: "A BRUH Minecraft Server"
  difficulty: normal
  gamemode: survival
  max_players: 20
  view_distance: 10
  simulation_distance: 10
  # online_mode=false lets clients connect without a Microsoft/Mojang account
  # (cracked/offline mode). Safe for LAN-only servers and for kids who don't
  # have Xbox Live sign-in. Required alongside enforce_secure_profile=false
  # to avoid the "Please log into Xbox" / signed-profile messages.
  online_mode: true
  # enforce_secure_profile: since Minecraft 1.19+, the server can require
  # every client to present a Mojang-signed chat profile. When online_mode
  # is off, clients have no such profile and are kicked with "You are not
  # permitted to join due to the enforce-secure-profile setting". Default
  # to false so offline accounts work out-of-the-box; also auto-forced to
  # false whenever online_mode=false regardless of this setting.
  enforce_secure_profile: false
  pvp: true
  hardcore: false
  allow_flight: false
  white_list: false
  spawn_protection: 16
  level_name: world
  level_seed: ""
  level_type: minecraft:normal
  # World-generation / gameplay toggles (server.properties passthroughs)
  allow_nether: true
  generate_structures: true
  spawn_monsters: true
  spawn_animals: true
  spawn_npcs: true
  prevent_proxy_connections: false
  hide_online_players: false
  resource_pack: ""
  resource_pack_sha1: ""
  require_resource_pack: false
  max_world_size: 29999984
  network_compression_threshold: 256
  entity_broadcast_range_percentage: 100
  memory_mb: 2048
  use_aikar_flags: true
  enable_command_block: false
  op_permission_level: 4
  # allow_cheats: convenience toggle that guarantees the "cheat" commands
  # (/gamemode, /give, /tp, /summon, /fill, …) are usable for OP'd players.
  # When true, forces enable-command-block=true and ensures
  # op-permission-level is at least 2 regardless of the raw option above.
  # Players still need to be OP'd to actually use the commands; use the
  # initial_ops list (or the panel → Players tab) to OP someone.
  allow_cheats: false
  # initial_ops: auto-OP these player names once the server starts. Handy
  # for a host who wants cheats on themselves (and their kids) without
  # having to run `op <name>` manually after every fresh install. Entries
  # are applied via RCON, so UUID lookup works in online and offline mode.
  initial_ops: []
  rcon_password: ""
  auto_update_server: true
  auto_backup: true
  backup_interval_minutes: 60
  backup_keep_count: 48
  backup_use_git: true
  auto_restart_on_crash: true
  auto_restart_schedule: ""
  enable_ha_integration: true
  announce_ha_events: true
  enable_bedrock_support: true
  # Geyser Bedrock auth-type:
  #   auto      — pick automatically: `offline` when online_mode=false,
  #               `floodgate` when online_mode=true (recommended default).
  #   floodgate — Bedrock client must be signed in to Xbox Live (XUID
  #               is used by Floodgate to ID the player). This is what
  #               GeyserMC recommends for public servers.
  #   online    — Bedrock client is prompted with "Please log into Xbox"
  #               on every connect. Rarely what anyone wants.
  #   offline   — NO Xbox sign-in needed on the Bedrock device; player
  #               joins with whatever username is set on their client.
  #               The right choice for LAN-only / family servers where
  #               the kids don't have Xbox accounts.
  geyser_auth_type: auto
  # Geyser Bedrock MTU. Lowering from the default 1400 to 1200 fixes the
  # iOS "Connecting multiplayer server..." hang on flaky home Wi-Fi by
  # sidestepping UDP fragmentation. Range 576–1492.
  geyser_mtu: 1400
  # Auto-kick ghost sessions: when Paper rejects a new login with
  # "You are already connected to this server!" (because the previous
  # connection hung and hasn't timed out yet), kick the stale session
  # over RCON so the next retry succeeds. No plugin needed — a
  # background daemon tails the server log and issues /kick.
  auto_kick_ghost_sessions: true
  # Paper connection-throttle (ms). Default 4000; 0 disables and avoids
  # the "Slow down, you're connecting too fast!" kick on rapid iOS
  # retries. Safe to leave on for public servers, fine to turn off on LAN.
  connection_throttle_ms: 4000
  # Auto-kick a player after N minutes of being idle. 0 disables.
  # Low values (e.g. 5) help clean up ghost sessions quickly in addition
  # to `auto_kick_ghost_sessions`.
  player_idle_timeout_minutes: 0
  plugins: []
  extra_jvm_args: ""
  log_level: info
schema:
  eula: bool
  active_world: "match(^[A-Za-z0-9_-]{1,32}$)?"
  server_type: "list(paper|purpur|vanilla|fabric|forge|folia)"
  minecraft_version: "match(^(LATEST|SNAPSHOT|(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(\\.(0|[1-9]\\d*))?(-.+)?)$)"
  motd: str
  difficulty: "list(peaceful|easy|normal|hard)"
  gamemode: "list(survival|creative|adventure|spectator)"
  max_players: "int(1,1000)"
  view_distance: "int(3,32)"
  simulation_distance: "int(3,32)"
  online_mode: bool
  enforce_secure_profile: bool
  pvp: bool
  hardcore: bool
  allow_flight: bool
  white_list: bool
  spawn_protection: "int(0,10000)"
  level_name: str
  level_seed: "str?"
  level_type: "str?"
  allow_nether: bool
  generate_structures: bool
  spawn_monsters: bool
  spawn_animals: bool
  spawn_npcs: bool
  prevent_proxy_connections: bool
  hide_online_players: bool
  resource_pack: "str?"
  resource_pack_sha1: "str?"
  require_resource_pack: bool
  max_world_size: "int(1,29999984)"
  network_compression_threshold: "int(-1,65536)"
  entity_broadcast_range_percentage: "int(10,1000)"
  memory_mb: "int(512,65536)"
  use_aikar_flags: bool
  enable_command_block: bool
  op_permission_level: "int(1,4)"
  allow_cheats: bool
  initial_ops:
    - "match(^[A-Za-z0-9_]{1,16}$)"
  rcon_password: "password?"
  auto_update_server: bool
  auto_backup: bool
  backup_interval_minutes: "int(5,1440)"
  backup_keep_count: "int(1,500)"
  backup_use_git: bool
  auto_restart_on_crash: bool
  auto_restart_schedule: "str?"
  enable_ha_integration: bool
  announce_ha_events: bool
  enable_bedrock_support: bool
  geyser_auth_type: "list(auto|floodgate|online|offline)"
  geyser_mtu: "int(576,1492)"
  auto_kick_ghost_sessions: bool
  connection_throttle_ms: "int(0,60000)"
  player_idle_timeout_minutes: "int(0,1440)"
  plugins:
    - url: "url"
      name: "str?"
  extra_jvm_args: "str?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

# Volume mappings for file access
map:
  - config:rw
  - share:rw
  - backup:rw

# API access for Home Assistant integration
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false

# Auto-discovery: registers "bruh_minecraft" service with the Supervisor
# so HA Core can auto-discover and offer to set up the companion integration
discovery:
  - bruh_minecraft
