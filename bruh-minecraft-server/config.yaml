---
name: "BRUH Minecraft Server"
description: "Rock-solid Minecraft Java Edition server with ingress panel, RCON, git world backups, auto-updates, plugin management, and deep Home Assistant integration"
version: "1.11.0"
slug: "bruh_minecraft_server"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bruh-minecraft-server"

# AppArmor profile
apparmor: false

# Boot policy
boot: auto
startup: services
stage: stable

# Web interface configuration (ingress panel)
ingress: true
ingress_port: 8099
panel_icon: mdi:minecraft
panel_title: "Minecraft"
panel_admin: true

# Minecraft networking
# host_network: true is REQUIRED for Bedrock LAN discovery — iOS, Android,
# consoles, and Win10/11 find local servers via UDP multicast/broadcast on
# port 19132, and Docker's bridge network drops those packets. With host
# networking the container shares the HA host's network stack directly, so:
#   * Bedrock LAN pings reach the server and the world shows up in the
#     "Friends" tab of Minecraft Bedrock without manual IP entry.
#   * All ports below bind directly to the host (no Docker NAT translation).
# Ingress (the management panel) still works because the Supervisor proxies
# it over a unix socket, not a TCP port.
host_network: true
ports:
  25565/tcp: 25565
  25565/udp: 25565
  19132/udp: 19132
  24454/udp: 24454
ports_description:
  25565/tcp: "Minecraft Java Edition (TCP)"
  25565/udp: "Minecraft Java Edition (UDP)"
  19132/udp: "Minecraft Bedrock / Geyser (optional)"
  24454/udp: "Simple Voice Chat (optional)"

# ============================================================================
# App configuration options
# ----------------------------------------------------------------------------
# These are INSTALL / CONTAINER-level options only. Per-world GAMEPLAY settings
# (gamemode, difficulty, PVP, world-gen, whitelist, resource pack, view
# distance, etc.) are NOT here — they live in each world's own
# server.properties and are edited from the ingress panel's "Server
# Properties" tab. That's what lets every world be independent (one creative,
# one survival, …); switching worlds loads that world's own settings.
#
# Every option below is documented inline: what it does, the valid range, and
# WHY the default is what it is. Validation rules are in the `schema:` block.
# ============================================================================
options:
  # ──────────────────────────────────────────────────────────────────────
  # Licensing — required before the server will start
  # ──────────────────────────────────────────────────────────────────────
  # You must accept Mojang's EULA (https://www.minecraft.net/eula) to run a
  # server. Left false by default because silently accepting a legal
  # agreement on the user's behalf isn't ours to do — the add-on refuses to
  # start until you flip this to true.
  eula: false

  # ──────────────────────────────────────────────────────────────────────
  # World selection
  # ──────────────────────────────────────────────────────────────────────
  # active_world: which world is currently live. Each world lives at
  # /config/minecraft-worlds/<name>/ with its OWN server.properties (so its
  # own gamemode/difficulty/etc.), world save, plugins/, ops/whitelist/bans,
  # and backup history. Only ONE runs at a time — this is how you keep, say,
  # a creative sandbox and a hard survival world side by side and flip
  # between them.
  #
  # You normally don't edit this by hand: use the panel → Worlds tab →
  # "Switch", which sets this and restarts the add-on so the new world loads.
  # The legacy /config/minecraft/ directory migrated to "default" in 1.3.0.
  active_world: default

  # ──────────────────────────────────────────────────────────────────────
  # Server software & version
  # ──────────────────────────────────────────────────────────────────────
  # server_type: which server software to download and run.
  #   paper   — Spigot/Bukkit-compatible, high-performance, supports plugins.
  #             The default: best all-round choice for a home server.
  #   purpur  — Paper fork with extra gameplay-tweaking config; plugin-compatible.
  #   folia   — Paper's regionised-threading fork for very large player counts;
  #             niche — most plugins aren't Folia-compatible yet.
  #   vanilla — Mojang's official server. No plugins. Use for a pure,
  #             unmodified experience.
  #   fabric  — Lightweight mod loader (server-side mods go in mods/).
  #   forge   — The classic mod loader (heavier; many large modpacks target it).
  # Paper is the default because it runs faster than vanilla, accepts the huge
  # Bukkit plugin ecosystem, and is what this add-on's plugin features target.
  server_type: paper
  # minecraft_version: which game version to run.
  #   LATEST   — newest STABLE release of the chosen server_type (recommended).
  #   SNAPSHOT — newest build including pre-releases (bleeding edge; may break).
  #   x.y.z    — pin an exact version, e.g. "1.21.4". Useful when a plugin or
  #              modpack only supports a specific version.
  # Defaults to LATEST so a fresh install is current and auto_update_server
  # keeps it that way.
  minecraft_version: LATEST

  # ──────────────────────────────────────────────────────────────────────
  # Memory & JVM (process-level — applies to whichever world is running)
  # ──────────────────────────────────────────────────────────────────────
  # memory_mb: heap size (both -Xms and -Xmx) handed to the JVM. 2048 (2 GB)
  # comfortably runs a small survival world. Rule of thumb: 1–2 GB for a few
  # friends, 4–6 GB for a busy server with plugins, more for big modpacks.
  # Don't set this near your host's total RAM — leave headroom for the OS and
  # Home Assistant. Range 512–65536.
  memory_mb: 2048
  # use_aikar_flags: launch the JVM with "Aikar's flags" — a well-known set of
  # G1GC tuning options that reduce GC lag spikes on Minecraft servers
  # (https://docs.papermc.io/paper/aikars-flags). Default true: community
  # best-practice, helps at almost any heap size. Set false only if you supply
  # your own GC tuning via extra_jvm_args.
  use_aikar_flags: true
  # extra_jvm_args: additional flags appended to the java command line, space
  # separated (e.g. "-Dpaper.playerconnection.keepalive=30"). Blank by
  # default. For experts — bad flags can stop the server booting.
  extra_jvm_args: ""

  # ──────────────────────────────────────────────────────────────────────
  # RCON (remote console — how the panel and HA talk to the server)
  # ──────────────────────────────────────────────────────────────────────
  # rcon_password: password for the RCON admin channel the ingress panel,
  # stats collector, and HA integration use. Leave BLANK and the add-on
  # generates a strong random password and stores it privately — the
  # recommended setup, since RCON only listens on localhost inside the
  # container. Set an explicit value only if an external tool must connect.
  rcon_password: ""

  # ──────────────────────────────────────────────────────────────────────
  # Updates, backups & crash recovery
  # ──────────────────────────────────────────────────────────────────────
  # auto_update_server: re-resolve and download the latest server jar for the
  # chosen type/version on every boot. Default true so you stay current. Set
  # false to freeze on the installed jar (e.g. while a plugin catches up to a
  # new Minecraft release).
  auto_update_server: true
  # auto_backup: run the background backup watcher. Default true — cheap
  # insurance against a corrupted world or a bad /fill.
  auto_backup: true
  # backup_interval_minutes: how often the watcher snapshots the world.
  # Default 60. Lower = more frequent safety net, more disk churn. Range 5–1440.
  backup_interval_minutes: 60
  # backup_keep_count: how many snapshots to retain before pruning the oldest.
  # Default 48 (≈ 2 days at hourly backups). Range 1–500.
  backup_keep_count: 48
  # backup_use_git: store backups as incremental git commits (space-efficient,
  # full history, restore any point) rather than full tar archives. Default
  # true — git only stores what changed between snapshots.
  backup_use_git: true
  # auto_restart_on_crash: automatically relaunch the JVM if it exits
  # unexpectedly. Default true. A crash loop is rate-limited (5 crashes in
  # 5 minutes => give up) so a hard-broken server doesn't thrash forever.
  auto_restart_on_crash: true
  # auto_restart_schedule: cron expression for a scheduled restart (e.g.
  # "0 4 * * *" for 4 AM daily). Blank = none. A nightly restart can clear
  # memory fragmentation on long-running servers.
  auto_restart_schedule: ""

  # ──────────────────────────────────────────────────────────────────────
  # Home Assistant integration
  # ──────────────────────────────────────────────────────────────────────
  # enable_ha_integration: deploy the companion `bruh_minecraft` custom
  # integration and run the file-IPC bridge, exposing sensors (players, TPS,
  # version, difficulty, gamemode…) and services (run command, say, backup) to
  # Home Assistant. Default true — it's the point of running this inside HA.
  enable_ha_integration: true
  # announce_ha_events: let HA automations broadcast in-game messages (e.g.
  # "front door opened") via the integration. Default true. Set false if you
  # want the sensors/services but not chat announcements.
  announce_ha_events: true

  # ──────────────────────────────────────────────────────────────────────
  # Bedrock cross-play (Geyser + Floodgate)
  # ──────────────────────────────────────────────────────────────────────
  # enable_bedrock_support: auto-install Geyser (protocol translation) and
  # Floodgate (auth bridge) so Bedrock clients — iOS, Android, consoles,
  # Win10/11 — can join this Java server. Default true. Requires a
  # Paper/Purpur/Folia server_type (Geyser is a plugin). With host networking
  # Bedrock devices even auto-discover the server on LAN.
  enable_bedrock_support: true
  # geyser_auth_type: how Bedrock clients authenticate.
  #   auto      — pick automatically: `offline` when the active world's
  #               online-mode is off, `floodgate` when it's on (recommended).
  #   floodgate — Bedrock client must be signed in to Xbox Live (recommended
  #               by GeyserMC for public servers).
  #   online    — Bedrock client is prompted with "Please log into Xbox" on
  #               every connect. Rarely what anyone wants.
  #   offline   — NO Xbox sign-in needed; player joins with whatever username
  #               their client uses. Right for LAN-only / family servers.
  # `auto` is the default because it does the right thing based on the active
  # world's online-mode without you having to reason about it.
  geyser_auth_type: auto
  # geyser_mtu: max UDP packet size Geyser uses for Bedrock. 1400 is Geyser's
  # default. Lowering to 1200 fixes the iOS "Connecting to multiplayer
  # server..." hang on flaky home Wi-Fi by sidestepping UDP fragmentation.
  # Range 576–1492.
  geyser_mtu: 1400

  # ──────────────────────────────────────────────────────────────────────
  # Connection reliability daemon (global background helper)
  # ──────────────────────────────────────────────────────────────────────
  # auto_kick_ghost_sessions: when Paper rejects a new login with "You are
  # already connected to this server!" (a previous connection hung and hasn't
  # timed out), kick the stale session over RCON so the retry succeeds.
  # Default true. No plugin needed — a background daemon tails the log and
  # issues /kick. Especially helps iOS Bedrock reconnects. (The related
  # connection-throttle and idle-timeout are now per-world server.properties
  # settings you edit in the panel.)
  auto_kick_ghost_sessions: true

  # ──────────────────────────────────────────────────────────────────────
  # Plugin management (Paper / Purpur / Folia only)
  # ──────────────────────────────────────────────────────────────────────
  # auto_quarantine_duplicates: on every boot, detect duplicate plugin jars
  # (e.g. both `multiverse-core-5.6.2.jar` AND a leftover
  # `multiverse-core-5.6.2-pre.jar`) that make Paper log "Ambiguous plugin
  # name" and randomly disable one copy. With this on, the add-on reads each
  # jar's plugin.yml, groups by plugin name, and MOVES all but the
  # highest-semver copy to plugins/.quarantine/ (jars are NOT deleted —
  # restore by moving them back). Default true. Turn off only if you
  # intentionally keep multiple copies of a plugin in the folder.
  auto_quarantine_duplicates: true
  # plugins: list of Bukkit plugin .jar URLs to install every boot into
  # the active world's plugins/ folder (Paper/Purpur/Folia only — Fabric
  # and Forge mods go in plugins/ manually or via the Dockerfile).
  # Two accepted shapes — pick whichever is easier:
  #
  #   plugins:
  #     - url: https://.../Essentials.jar
  #       name: Essentials.jar          # optional filename on disk
  #     - https://.../ViaVersion.jar    # shorthand — plain URL string
  #
  # You can mix the two in one list. Downloads use If-Modified-Since so
  # unchanged files aren't re-fetched on every restart. Bad URLs (404,
  # HTML rate-limit bodies, non-ZIP content) are skipped with a warning
  # and the server still starts. To remove a plugin permanently, remove the
  # entry here AND delete the jar from the panel. Empty by default.
  plugins: []
  # Popular-plugin one-click installers. Each toggle is a curated, well-known
  # Bukkit/Spigot plugin; when true the add-on resolves the latest
  # Paper/Spigot/Folia-compatible build via the Modrinth API on every boot and
  # installs it into the ACTIVE world's plugins/ folder. Full per-command
  # reference: ./PLUGINS.md.
  #
  # SCOPE: these toggles are GLOBAL — they apply to whichever world is
  # currently active. When you switch worlds, the same set is installed into
  # the new world's plugins/ folder on boot, so every world gets the same
  # plugin lineup. (For per-world plugin differences, delete jars from a
  # specific world via the panel's Plugins tab while that world is active.)
  #
  # DEPENDENCIES are auto-enforced: enabling EssentialsX Chat auto-enables
  # EssentialsX, and enabling ViaBackwards auto-enables ViaVersion (it
  # depends on ViaVersion to load). You don't need to remember which needs
  # which.
  #
  # DUPLICATES: if you also add a matching plugin URL to the `plugins:` list
  # above, the popular installer skips it on the next boot (so you don't end
  # up with two copies of the same jar). The duplicate-jar quarantine
  # (`auto_quarantine_duplicates`) is a second safety net.
  #
  # Toggling back to false does NOT remove the jar — delete it from the
  # panel's Plugins tab to remove.
  install_essentialsx: false         # /home, /sethome, /tpa, /spawn, /warp, /heal, /feed, /kit, mute/jail, economy. The "everyday QoL" pack.
  install_essentialsx_chat: false    # Chat formatting + per-group prefixes (e.g. coloured names, [Admin] tags). Pairs with LuckPerms. NEEDS EssentialsX (auto-enabled).
  install_luckperms: false           # The standard permissions manager — groups, per-command permissions, chat prefixes. The "give my mods access to /kick but not /op" plugin.
  install_worldedit: false           # In-game mass block editing for builders: //wand selects a region, then //set / //copy / //paste / //replace / //cyl / terrain smoothing. The plugin for creative servers.
  install_coreprotect: false         # Block-history "forensics": logs every place/break/container/chat. `/co lookup` shows who did what; `/co rollback time:1h player:Bob` undoes a griefing spree. Essential on any open server.
  install_griefprevention: false     # Player-driven land protection: each player gets a golden shovel and claims land by clicking corners; their claim is auto-protected from other players. Great for survival multiplayer with strangers.
  install_mcmmo: false               # RPG-style skills (mining, woodcutting, swords, archery, …). Players level them by doing the activity; higher levels unlock perks. Adds long-term progression to plain survival.
  install_chestsort: false           # Auto-sort chests/inventories on click or open. Pure quality-of-life, zero downside.
  install_veinminer: false           # Sneak + break one ore mines the whole vein in a single action. Saves your wrists.
  install_spark: false               # Performance profiler. `/spark profiler` tells you which plugin or chunk is causing TPS lag. Reach for it when "the server feels slow".
  # Cross-version protocol bridges (default ON). ViaVersion lets clients on a
  # NEWER Minecraft version connect to an older server; ViaBackwards lets OLDER
  # clients connect to a newer server. Together they hide the gap between a
  # Mojang release and the matching Paper build ("Outdated server!" /
  # "This server does not support Java Edition X.Y"). Lightweight; safe to
  # leave on. ViaBackwards needs ViaVersion to load (auto-enforced).
  install_viaversion: true
  install_viabackwards: true

  # ──────────────────────────────────────────────────────────────────────
  # Add-on logging
  # ──────────────────────────────────────────────────────────────────────
  # log_level: verbosity of the ADD-ON's own logging (not Minecraft's).
  #   trace/debug — diagnosing add-on problems.
  #   info        — normal (default).
  #   notice/warning/error/fatal — progressively quieter.
  log_level: info
schema:
  eula: bool
  active_world: "match(^[A-Za-z0-9_-]{1,32}$)?"
  server_type: "list(paper|purpur|vanilla|fabric|forge|folia)"
  minecraft_version: "match(^(LATEST|SNAPSHOT|(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(\\.(0|[1-9]\\d*))?(-.+)?)$)"
  memory_mb: "int(512,65536)"
  use_aikar_flags: bool
  extra_jvm_args: "str?"
  rcon_password: "password?"
  auto_update_server: bool
  auto_backup: bool
  backup_interval_minutes: "int(5,1440)"
  backup_keep_count: "int(1,500)"
  backup_use_git: bool
  auto_restart_on_crash: bool
  auto_restart_schedule: "str?"
  enable_ha_integration: bool
  announce_ha_events: bool
  enable_bedrock_support: bool
  geyser_auth_type: "list(auto|floodgate|online|offline)"
  geyser_mtu: "int(576,1492)"
  auto_kick_ghost_sessions: bool
  auto_quarantine_duplicates: bool
  plugins:
    - url: "url"
      name: "str?"
  install_essentialsx: bool
  install_essentialsx_chat: bool
  install_luckperms: bool
  install_worldedit: bool
  install_coreprotect: bool
  install_griefprevention: bool
  install_mcmmo: bool
  install_chestsort: bool
  install_veinminer: bool
  install_spark: bool
  install_viaversion: bool
  install_viabackwards: bool
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

# Volume mappings for file access
map:
  - config:rw
  - share:rw
  - backup:rw

# API access for Home Assistant integration
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false

# Auto-discovery: registers "bruh_minecraft" service with the Supervisor
# so HA Core can auto-discover and offer to set up the companion integration
discovery:
  - bruh_minecraft
