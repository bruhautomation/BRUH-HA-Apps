rcon_command:
  name: Run RCON command
  description: Execute an arbitrary server command. Do not include the leading slash.
  fields:
    command:
      name: Command
      description: 'Example: "weather clear"'
      required: true
      selector:
        text: {}

say:
  name: Broadcast chat
  description: Send a chat message to all players using /say.
  fields:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true

give:
  name: Give item
  description: Give an item to a player.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    item:
      name: Item id
      required: true
      example: "minecraft:diamond"
      selector:
        text: {}
    amount:
      name: Amount
      default: 1
      selector:
        number:
          min: 1
          max: 64
          step: 1

set_weather:
  name: Set weather
  fields:
    weather:
      name: Weather
      required: true
      selector:
        select:
          options: [clear, rain, thunder]

set_time:
  name: Set time
  fields:
    time:
      name: Time
      description: Preset (day/night/noon/midnight) or integer ticks.
      required: true
      selector:
        text: {}

backup_now:
  name: Back up world
  description: Trigger an immediate world backup (git or tar, per add-on config).

restart_server:
  name: Restart server
  description: Save and restart the Minecraft server.

stop_server:
  name: Stop server
  description: Save and stop the Minecraft server; the add-on remains running.

op_player:
  name: Op player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

deop_player:
  name: De-op player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

kick_player:
  name: Kick player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

ban_player:
  name: Ban player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

whitelist_add:
  name: Whitelist add
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

whitelist_remove:
  name: Whitelist remove
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

pardon_player:
  name: Unban player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

teleport:
  name: Teleport player
  description: Move a player to another player, or to x/y/z coordinates.
  fields:
    player:
      name: Player
      description: Who to move — a player name, or @a for everyone.
      required: true
      example: "Steve"
      selector:
        text: {}
    to_player:
      name: To player
      description: The player to move them to. Leave empty to use x/y/z.
      example: "Alex"
      selector:
        text: {}
    x:
      name: X
      description: A number, or ~ / ~5 relative to where they are.
      selector:
        text: {}
    y:
      name: Y
      selector:
        text: {}
    z:
      name: Z
      selector:
        text: {}

set_gamemode:
  name: Set game mode
  description: Change one player's game mode.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    gamemode:
      name: Game mode
      required: true
      selector:
        select:
          options: [survival, creative, adventure, spectator]

get_status:
  name: Get status
  description: Who is online right now, beside the last collected server stats. Returns response data.

get_world:
  name: Get world
  description: What is going on in the world now - who is on and where, the time, day and weather, recent events, the last save and backup, and Vesper's builds. Returns response data.

list_builds:
  name: List builds
  description: Vesper's build log, newest first. Returns response data.
  fields:
    status:
      name: Status
      description: Only jobs with this status.
      selector:
        select:
          options: [queued, building, done, failed]
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 200

save_build:
  name: Save build
  description: Add a job to Vesper's build log (give a title), or change one (give its id). A job set to done with bounds gets a top-down picture.
  fields:
    id:
      name: Job id
      description: The job to change. Leave out to add a new one.
      selector:
        text: {}
    title:
      name: Title
      description: What is being built.
      selector:
        text: {}
    part:
      name: Part of the engine
      description: Which part of the sentience engine this build is for (any label).
      selector:
        text: {}
    status:
      name: Status
      selector:
        select:
          options: [queued, building, done, failed]
    progress:
      name: Progress
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bounds:
      name: Bounds
      description: 'The build''s box: {"x1": 0, "z1": 0, "x2": 16, "z2": 16, "y1": 60, "y2": 90, "dimension": "minecraft:overworld"}.'
      selector:
        object: {}
    notes:
      name: Notes
      selector:
        text:
          multiline: true
    image:
      name: Picture
      description: A picture of the build (a /local/ path or URL), if not drawn from the world.
      selector:
        text: {}
    by:
      name: Builder
      description: Who builds it (Vesper unless said).
      selector:
        text: {}

delete_build:
  name: Delete build
  description: Remove a job from Vesper's build log.
  fields:
    id:
      name: Job id
      required: true
      selector:
        text: {}

list_addons:
  name: List add-ons
  description: What the add-on browser can offer this server, and what is installed in the active world. Returns response data.

search_addons:
  name: Search add-ons
  description: Search Modrinth for server-side add-ons this server can run (every player gets them, Bedrock/iPad included). Returns response data.
  fields:
    kind:
      name: Kind
      selector:
        select:
          options: [plugin, datapack, mod, resourcepack]
    query:
      name: Search
      example: "chairs"
      selector:
        text: {}
    offset:
      name: Offset
      selector:
        number: { min: 0, max: 10000, step: 20 }

install_addon:
  name: Install add-on
  description: Add a Modrinth project (and anything it requires) to the active world.
  fields:
    id:
      name: Project id
      description: The Modrinth project id from search_addons.
      required: true
      selector:
        text: {}
    kind:
      name: Kind
      required: true
      selector:
        select:
          options: [plugin, datapack, mod, resourcepack]

remove_addon:
  name: Remove add-on
  description: Take an add-on installed by the browser out of the active world.
  fields:
    id:
      name: Project id
      required: true
      selector:
        text: {}
