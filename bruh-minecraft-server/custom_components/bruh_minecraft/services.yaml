rcon_command:
  name: Run RCON command
  description: Execute an arbitrary server command. Do not include the leading slash.
  fields:
    command:
      name: Command
      description: 'Example: "weather clear"'
      required: true
      selector:
        text: {}

say:
  name: Broadcast chat
  description: Send a chat message to all players using /say.
  fields:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true

give:
  name: Give item
  description: Give an item to a player.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    item:
      name: Item id
      required: true
      example: "minecraft:diamond"
      selector:
        text: {}
    amount:
      name: Amount
      default: 1
      selector:
        number:
          min: 1
          max: 64
          step: 1

set_weather:
  name: Set weather
  fields:
    weather:
      name: Weather
      required: true
      selector:
        select:
          options: [clear, rain, thunder]

set_time:
  name: Set time
  fields:
    time:
      name: Time
      description: Preset (day/night/noon/midnight) or integer ticks.
      required: true
      selector:
        text: {}

backup_now:
  name: Back up world
  description: Trigger an immediate world backup (git or tar, per add-on config).

restart_server:
  name: Restart server
  description: Save and restart the Minecraft server.

stop_server:
  name: Stop server
  description: Save and stop the Minecraft server; the add-on remains running.

op_player:
  name: Op player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

deop_player:
  name: De-op player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

kick_player:
  name: Kick player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

ban_player:
  name: Ban player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

whitelist_add:
  name: Whitelist add
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

whitelist_remove:
  name: Whitelist remove
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

pardon_player:
  name: Unban player
  fields:
    player: { name: Player, required: true, selector: { text: {} } }

teleport:
  name: Teleport player
  description: Move a player to another player, or to x/y/z coordinates.
  fields:
    player:
      name: Player
      description: Who to move — a player name, or @a for everyone.
      required: true
      example: "Steve"
      selector:
        text: {}
    to_player:
      name: To player
      description: The player to move them to. Leave empty to use x/y/z.
      example: "Alex"
      selector:
        text: {}
    x:
      name: X
      description: A number, or ~ / ~5 relative to where they are.
      selector:
        text: {}
    y:
      name: Y
      selector:
        text: {}
    z:
      name: Z
      selector:
        text: {}

set_gamemode:
  name: Set game mode
  description: Change one player's game mode.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    gamemode:
      name: Game mode
      required: true
      selector:
        select:
          options: [survival, creative, adventure, spectator]

get_status:
  name: Get status
  description: Who is online right now, beside the last collected server stats. Returns response data.

get_world:
  name: Get world
  description: What is going on in the world now - who is on and where, the time, day and weather, recent events, the last save and backup, and the companion's builds. Returns response data.

list_builds:
  name: List builds
  description: The companion's build log, newest first. Returns response data.
  fields:
    status:
      name: Status
      description: Only jobs with this status.
      selector:
        select:
          options: [queued, building, done, failed]
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 200

save_build:
  name: Save build
  description: Add a job to the companion's build log (give a title), or change one (give its id). A job set to done with bounds gets a top-down picture.
  fields:
    id:
      name: Job id
      description: The job to change. Leave out to add a new one.
      selector:
        text: {}
    title:
      name: Title
      description: What is being built.
      selector:
        text: {}
    part:
      name: Part of the engine
      description: Which part of the sentience engine this build is for (any label).
      selector:
        text: {}
    status:
      name: Status
      selector:
        select:
          options: [queued, building, done, failed]
    progress:
      name: Progress
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bounds:
      name: Bounds
      description: 'The build''s box: {"x1": 0, "z1": 0, "x2": 16, "z2": 16, "y1": 60, "y2": 90, "dimension": "minecraft:overworld"}.'
      selector:
        object: {}
    notes:
      name: Notes
      selector:
        text:
          multiline: true
    image:
      name: Picture
      description: A picture of the build (a /local/ path or URL), if not drawn from the world.
      selector:
        text: {}
    by:
      name: Builder
      description: Who builds it (brAIn unless said).
      selector:
        text: {}

delete_build:
  name: Delete build
  description: Remove a job from the companion's build log.
  fields:
    id:
      name: Job id
      required: true
      selector:
        text: {}

list_addons:
  name: List add-ons
  description: What the add-on browser can offer this server, and what is installed in the active world. Returns response data.

search_addons:
  name: Search add-ons
  description: Search Modrinth for server-side add-ons this server can run (every player gets them, Bedrock/iPad included). Returns response data.
  fields:
    kind:
      name: Kind
      selector:
        select:
          options: [plugin, datapack, mod, resourcepack]
    query:
      name: Search
      example: "chairs"
      selector:
        text: {}
    offset:
      name: Offset
      selector:
        number: { min: 0, max: 10000, step: 20 }

install_addon:
  name: Install add-on
  description: Add a Modrinth project (and anything it requires) to the active world.
  fields:
    id:
      name: Project id
      description: The Modrinth project id from search_addons.
      required: true
      selector:
        text: {}
    kind:
      name: Kind
      required: true
      selector:
        select:
          options: [plugin, datapack, mod, resourcepack]

remove_addon:
  name: Remove add-on
  description: Take an add-on installed by the browser out of the active world.
  fields:
    id:
      name: Project id
      required: true
      selector:
        text: {}

get_companion:
  name: Companion
  description: The companion's hands in the game — who it is (the name and colour brAIn last set), the named places, the choice-pad questions, the action log (each undoable action has an id), what it said, and whether the server checks the accounts behind the names in chat. Returns response data.

set_companion:
  name: Set the companion
  description: Tell the add-on who the companion is, for its panel and as the default speaker. A companion (brAIn) calls this; each field is optional.
  fields:
    name:
      name: Name
      description: The name it goes by in the game, up to 16 letters.
      selector:
        text: {}
    colour:
      name: Colour
      description: The colour of its name in chat, one of Minecraft's sixteen colour names.
      selector:
        text: {}
    active:
      name: Active
      description: Whether a companion is running. Switching it off takes anything it has out of the world.
      selector:
        boolean: {}
    by:
      name: Run by
      selector:
        text: {}
    model:
      name: Model
      description: The model it answers with, shown on the panel.
      selector:
        text: {}

companion_say:
  name: Say something as the companion
  description: A message in the game's chat under a speaker name and colour, to named players or to everyone in the game. The add-on decides nothing about who may hear what; the caller does.
  fields:
    to:
      name: To
      description: A player's Minecraft name, a list of them, or everyone.
      default: everyone
      selector:
        text: {}
    message:
      name: Message
      required: true
      description: What it says. Long messages are split over a few lines.
      selector:
        text: {}
    name:
      name: Speaker
      description: The name it is said under; the companion's own name if left out.
      selector:
        text: {}
    colour:
      name: Colour
      selector:
        text: {}
    chime:
      name: Chime
      description: Play a soft chime to each player it is said to.
      selector:
        boolean: {}
    by:
      name: Asked by
      description: Who asked, for the log.
      selector:
        text: {}

companion_appear:
  name: Bring the companion beside a player
  description: An invulnerable, silent allay named as the companion appears beside a player for some seconds, with a chime, sparkles and a little wave, and then goes. Logged and undoable.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    seconds:
      name: Seconds
      default: 25
      selector:
        number: { min: 3, max: 120 }
    kind:
      name: Kind
      selector:
        select:
          options: [greet, visit]
    name:
      name: Name
      selector:
        text: {}
    colour:
      name: Colour
      selector:
        text: {}
    chime:
      name: Chime
      selector:
        select:
          options: [full, short, none]
    text:
      name: Log line
      selector:
        text: {}
    by:
      name: Asked by
      selector:
        text: {}

ask_choice:
  name: Ask with choice pads
  description: Put a two- or three-picture question to a player. A green, a red (and a blue) pad go beside them with a picture above each, and an item floating over it when the option names one; standing on one for two seconds is the answer, announced as the bruh_minecraft_answer event. Asked the next time they play if they are not on.
  fields:
    player:
      name: Player
      description: The Minecraft name (Bedrock names keep their dot).
      required: true
      selector:
        text: {}
    question:
      name: Question
      description: The question in words, kept for the record; the player sees the pictures.
      required: true
      selector:
        text: {}
    options:
      name: Options
      description: Two or three options, each either a label, or an object with a label, a picture (a block id), an item (an item id shown floating over its pad, which nobody can pick up), a gift (an item) and a gift_count. Leave out for yes and no.
      selector:
        object: {}
    person:
      name: Person
      description: What the caller calls them, for the panel.
      selector:
        text: {}
    name:
      name: Speaker
      selector:
        text: {}
    by:
      name: Asked by
      selector:
        text: {}

companion_build:
  name: Build something small
  description: Up to 64 blocks, relative to a player's feet when a player is named. Only into empty space, on natural ground, never in a protected place or on or next to a build; logged, and undone with undo_action.
  fields:
    blocks:
      name: Blocks
      required: true
      description: 'A list of blocks, each with x, y, z and a block id, for example x 2, y 0, z 0, block oak_planks.'
      selector:
        object: {}
    player:
      name: Beside
      description: A Minecraft name; the coordinates are then offsets from where they stand.
      selector:
        text: {}
    dimension:
      name: Dimension
      description: For absolute coordinates (no player); minecraft:overworld unless given.
      selector:
        text: {}
    title:
      name: Title
      description: What it is, for the log ("a little bridge").
      selector:
        text: {}
    name:
      name: Speaker
      selector:
        text: {}
    by:
      name: Asked by
      description: Who asked, for the log.
      selector:
        text: {}

companion_edit:
  name: Change blocks (trusted)
  description: Any block, anywhere — placed, replaced or removed, boxes filled and shapes made — for a person the companion's caller trusts to ask for anything. Not held to the companion's own building rules. Every block's state before is saved first, so undo_action puts it all back; a large change is backed up first. At most 131,072 blocks in one edit.
  fields:
    blocks:
      name: Blocks
      description: 'A list of blocks, each with x, y, z, a block state (oak_planks, red_bed[facing=east,part=head]) and an optional mode remove.'
      selector:
        object: {}
    fills:
      name: Fills
      description: 'Boxes to fill, each with x1, y1, z1, x2, y2, z2 and a block (air clears it).'
      selector:
        object: {}
    shapes:
      name: Shapes
      description: 'Shapes, each with a kind and a block: line (from, to, radius, radius_end — a tapering trunk or branch), ellipsoid (center, radii [x, y, z], hollow), blob (center, radius, density 0–1, seed — foliage, rock), cylinder (base, height, radius, radius_top, hollow) or box (from, to, hollow). Points are [x, y, z]. Leaves far from a log need persistent=true.'
      selector:
        object: {}
    job:
      name: Job
      description: The caller's id for the work this edit is part of; undo_action with the job undoes every edit of it.
      selector:
        text: {}
    player:
      name: Beside
      description: A Minecraft name; the coordinates are then offsets from where they stand.
      selector:
        text: {}
    dimension:
      name: Dimension
      description: For absolute coordinates (no player); minecraft:overworld unless given.
      selector:
        text: {}
    title:
      name: Title
      description: What it is, for the log ("a new bedroom").
      selector:
        text: {}
    name:
      name: Speaker
      selector:
        text: {}
    by:
      name: Asked by
      description: Who asked, for the log.
      selector:
        text: {}

look_blocks:
  name: Look at the blocks
  description: The blocks in a box around a player or a point (at most 32 by 16 by 32), read from the saved world — every block that is not air, with its state, so a room's walls, doors and beds can be understood.
  fields:
    player:
      name: Around
      description: A Minecraft name; the box is around where they stand.
      selector:
        text: {}
    x:
      name: X
      selector:
        number:
          min: -30000000
          max: 30000000
    y:
      name: Y
      selector:
        number:
          min: -64
          max: 319
    z:
      name: Z
      selector:
        number:
          min: -30000000
          max: 30000000
    size:
      name: Size
      description: 'The box as three numbers, x, y and z (16, 8 and 16 unless given).'
      selector:
        object: {}
    dimension:
      name: Dimension
      selector:
        text: {}

undo_action:
  name: Undo the companion's action
  description: Put back what one of the companion's actions changed in the world (blocks that still hold what it placed, and its entities). Leave the id out for the newest one that can still be undone; give a job to undo every edit recorded for it, newest first.
  fields:
    id:
      name: Action id
      selector:
        text: {}
    job:
      name: Job
      description: Undo every edit made with this job id.
      selector:
        text: {}

companion_progress:
  name: Show progress
  description: A line on named players' action bar, above the hotbar — how a long job is going. Never in chat; it fades after a few seconds.
  fields:
    to:
      name: To
      description: A Minecraft name, a list of names, or everyone.
      required: true
      selector:
        text: {}
    text:
      name: Text
      required: true
      selector:
        text: {}
    percent:
      name: Percent
      description: How far along it is, shown after the text.
      selector:
        number:
          min: 0
          max: 100
    colour:
      name: Colour
      selector:
        text: {}

companion_thought:
  name: Show a thought
  description: One step of what the companion is thinking or doing for one player, shown where it is not in the way — a small bubble over the companion's allay, which hovers by what it is building and which everybody in the game sees (BRUH Sight, on Paper and Purpur), and in the journal book. Never in chat. Without BRUH Sight, a step of work shows on the action bar.
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    text:
      name: Text
      description: What it is doing now, in a few words.
      selector:
        text: {}
    state:
      name: State
      description: thinking (shown only if it lasts), working, done, failed, or clear (take the line away).
      selector:
        select:
          options: [thinking, working, done, failed, clear]
    key:
      name: Key
      description: Which line this is — "talk" for an answer being worked out, a job id for a job. Each key is its own line.
      selector:
        text: {}
    title:
      name: Title
      description: A short name for the line (a job's title).
      selector:
        text: {}
    percent:
      name: Percent
      selector:
        number:
          min: 0
          max: 100
    name:
      name: Name
      description: The companion's name, shown at the top of the bubble and in the journal.
      selector:
        text: {}
    colour:
      name: Colour
      selector:
        text: {}

give_journal:
  name: Give the journal
  description: A book named after the companion, unless the player already has one. Using it opens the companion's whole stream of thought — what it is doing now, every job, and the recent steps. Needs BRUH Sight (Paper and Purpur).
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    name:
      name: Name
      description: The book's name, at most 32 characters.
      required: true
      selector:
        text: {}

give_spyglass:
  name: Give a named spyglass
  description: One spyglass with this name, unless the player already has a spyglass by that name. Looking through any spyglass points at what is in the middle of it (the bruh_minecraft_point event).
  fields:
    player:
      name: Player
      required: true
      selector:
        text: {}
    name:
      name: Name
      description: The spyglass's name, at most 32 characters.
      required: true
      selector:
        text: {}

atlas:
  name: The atlas
  description: What is where in the world, worked out from the saved region files in the background — the buildings and roads near a player or a point (each building with its rooms), the building and room it is in, and a search of names and signs.
  fields:
    player:
      name: Around
      description: A Minecraft name; or give x and z (and y).
      selector:
        text: {}
    x:
      name: X
      selector:
        number:
          min: -30000000
          max: 30000000
    y:
      name: Y
      selector:
        number:
          min: -64
          max: 319
    z:
      name: Z
      selector:
        number:
          min: -30000000
          max: 30000000
    dimension:
      name: Dimension
      selector:
        text: {}
    radius:
      name: Radius
      description: Blocks around the point (64 unless given, at most 256).
      selector:
        number:
          min: 8
          max: 256
    query:
      name: Search
      description: Words to find in the names of buildings, rooms, places and signs.
      selector:
        text: {}

room:
  name: A room
  description: One room in full — its floor height and area, the free floor cells, doors, windows, light, furniture, the floor, wall and ceiling blocks and its kind — where a player stands, by its id, or at a point.
  fields:
    player:
      name: Where
      description: A Minecraft name.
      selector:
        text: {}
    room:
      name: Room id
      description: A room id from the atlas.
      selector:
        text: {}
    x:
      name: X
      selector:
        number:
          min: -30000000
          max: 30000000
    y:
      name: Y
      selector:
        number:
          min: -64
          max: 319
    z:
      name: Z
      selector:
        number:
          min: -30000000
          max: 30000000
    dimension:
      name: Dimension
      selector:
        text: {}

label_place:
  name: Name a place
  description: Give a room, a building or a point a name ("Ben's room"); a newer name for the same thing replaces the older. Kept with the world.
  fields:
    room:
      name: Room id
      selector:
        text: {}
    building:
      name: Building id
      selector:
        text: {}
    x:
      name: X
      selector:
        number:
          min: -30000000
          max: 30000000
    y:
      name: Y
      selector:
        number:
          min: -64
          max: 319
    z:
      name: Z
      selector:
        number:
          min: -30000000
          max: 30000000
    dimension:
      name: Dimension
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    by:
      name: Named by
      selector:
        text: {}

set_zone:
  name: Set a place
  description: Name a place in the world (x, z, radius). Nothing is ever built inside a protected one; delete removes it. A player walking into a named place fires bruh_minecraft_place.
  fields:
    name:
      name: Name
      required: true
      selector:
        text: {}
    x:
      name: X
      selector:
        number: { min: -30000000, max: 30000000, mode: box }
    z:
      name: Z
      selector:
        number: { min: -30000000, max: 30000000, mode: box }
    radius:
      name: Radius
      selector:
        number: { min: 1, max: 512 }
    dimension:
      name: Dimension
      selector:
        text: {}
    protect:
      name: Protect
      selector:
        boolean: {}
    kind:
      name: Kind
      selector:
        select:
          options: [family, companion]
    delete:
      name: Delete
      selector:
        boolean: {}

companion_handover:
  name: Hand over the old companion state
  description: The family list, memory and settings the add-on's own companion kept in this world up to 1.17.7, for brAIn to keep once. With done, the old state is retired and not read again. Returns response data.
  fields:
    done:
      name: Done
      selector:
        boolean: {}

rename_world:
  name: Rename the world
  description: Rename the active world to a name as said ("Our World"). The folder takes a safe form of it (Our_World) and the server list shows the name as said. Stops the server, keeps the backups, and restarts the add-on.
  fields:
    name:
      name: Name
      required: true
      selector:
        text: {}
