get_status:
  name: Get status
  description: Every printer's state, progress, temperatures and AMS, whether Bambu Studio
    is installed and running, and the latest jobs. Changes nothing.
list_files:
  name: List files
  description: The models and sliced print files in /share/bambu, with which are sliced, their
    plates, print time and weight.
printer_files:
  name: List the printer's files
  description: What is on a printer's own storage.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
find_printers:
  name: Find printers
  description: Look for Bambu Lab printers on the network Home Assistant is on, by the
    certificate each one's MQTT port answers with. Answers with each printer's address,
    serial number and model, and whether it is added already. Changes nothing.
  fields:
    subnet:
      name: Network
      description: The network to search instead, such as 192.168.2.0/24.
      example: 192.168.1.0/24
      selector:
        text: {}
print_file:
  name: Print a file
  description: Print a file from /share/bambu. A project that is not sliced yet is sliced
    first with the settings saved in it; a bare model (an STL, a STEP, a 3MF from
    Printables) with Bambu Studio's own profiles for the printer and the filament in
    the tray. Then it is uploaded to the printer and started.
  fields:
    file:
      name: File
      description: Its path inside /share/bambu, as list_files shows it.
      required: true
      example: sliced/benchy.gcode.3mf
      selector:
        text: {}
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    plate:
      name: Plate
      description: Which plate of the project to print. Left out, the first.
      selector:
        number:
          min: 1
          max: 64
          mode: box
    use_ams:
      name: Use the AMS
      description: Feed filament from the AMS. Left out, it is used when the printer has one.
      selector:
        boolean: {}
    ams_mapping:
      name: AMS slots
      description: Which AMS slot (0-based) feeds each filament in the file, in order. Left
        out, filament 1 from slot 1 and so on.
      example: '[0, 2]'
      selector:
        object: {}
    timelapse:
      name: Timelapse
      selector:
        boolean: {}
    bed_leveling:
      name: Bed levelling
      selector:
        boolean: {}
    flow_cali:
      name: Flow calibration
      selector:
        boolean: {}
    vibration_cali:
      name: Vibration calibration
      selector:
        boolean: {}
    machine:
      name: Machine profile
      description: 'Only for a bare model that has to be sliced: the printer profile name
        as Bambu Studio lists it, or one of your printers by its name (its model decides
        the profile).'
      example: Bambu Lab X1 Carbon 0.4 nozzle
      selector:
        text: {}
    process:
      name: Process profile
      description: 'Only for a bare model: the process profile name.'
      example: 0.20mm Standard @BBL X1C
      selector:
        text: {}
    filaments:
      name: Filament profiles
      description: 'Only for a bare model: filament profile names, one per filament.'
      selector:
        object: {}
    slot:
      name: Filament tray
      description: 'For a bare model (an STL, or a 3MF from Printables): the AMS tray
        to print from, 0 for the first, or "external" for the external spool. Left
        out, the tray that best matches the material and colour.'
      example: 0
      selector:
        text: {}
    material:
      name: Material
      description: 'For a bare model on the external spool, or to pick the AMS tray:
        PLA, PETG, ABS… Left out, PLA.'
      example: PETG
      selector:
        text: {}
    colour:
      name: Colour
      description: 'For a bare model with no tray named: the colour to look for in the
        AMS.'
      example: white
      selector:
        text: {}
    plate_type:
      name: Build plate
      description: 'The plate on the printer. The slice and the printer''s plate check follow
        it.'
      selector:
        select:
          options:
          - auto
          - textured_pei
          - smooth_pei
          - cool
          - engineering
    speed:
      name: Speed
      description: The speed profile to switch to once it starts.
      selector:
        select:
          options:
          - silent
          - standard
          - sport
          - ludicrous
    layer_inspect:
      name: First-layer inspection
      description: 'X1: let the lidar check the first layer.'
      selector:
        boolean: {}
    copies:
      name: Copies
      description: How many of it, arranged on the plate. The file is sliced again for this.
      selector:
        number:
          min: 1
          max: 50
          mode: box
    settings:
      name: Slicer settings
      description: 'For a model that is sliced here: options such as layer_height, walls,
        infill_percent, supports, brim, print_sequence (by layer or by object), ironing,
        seam. The panel''s Print dialog lists them all.'
      example: '{"layer_height": 0.12, "walls": 4, "print_sequence": "by object"}'
      selector:
        object: {}
slice_file:
  name: Slice a file
  description: Slice a project or model from /share/bambu with Bambu Studio and save the print
    file in /share/bambu/sliced.
  fields:
    file:
      name: File
      required: true
      example: benchy.3mf
      selector:
        text: {}
    plate:
      name: Plate
      description: 0 slices every plate.
      selector:
        number:
          min: 0
          max: 64
          mode: box
    machine:
      name: Machine profile
      description: The printer profile name as Bambu Studio lists it, or one of your printers
        by its name (its model decides the profile).
      selector:
        text: {}
    process:
      name: Process profile
      selector:
        text: {}
    filaments:
      name: Filament profiles
      selector:
        object: {}
    arrange:
      name: Arrange
      description: Arrange the objects on the plate first.
      selector:
        boolean: {}
    orient:
      name: Orient
      description: Turn each object to its best orientation first.
      selector:
        boolean: {}
pause_print:
  name: Pause
  description: Pause the current print.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
resume_print:
  name: Resume
  description: Resume a paused print.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
stop_print:
  name: Stop
  description: Stop the current print. A stopped print cannot be resumed.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
set_speed:
  name: Set speed
  description: The print speed profile.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    speed:
      name: Speed
      required: true
      selector:
        select:
          options:
          - silent
          - standard
          - sport
          - ludicrous
set_light:
  name: Chamber light
  description: Turn the chamber light on or off.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    'on':
      name: 'On'
      required: true
      selector:
        boolean: {}
set_temperature:
  name: Set temperature
  description: Set the nozzle or bed target. Refused while printing.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    target:
      name: Heater
      required: true
      selector:
        select:
          options:
          - nozzle
          - bed
    temperature:
      name: Temperature
      description: °C. Nozzle up to 300, bed up to 120; 0 turns it off.
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: °C
          mode: box
send_gcode:
  name: Send G-code
  description: Send G-code lines to the printer. Refused while printing; at most 32 lines.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    gcode:
      name: G-code
      required: true
      example: G28
      selector:
        text:
          multiline: true
open_in_studio:
  name: Open in Bambu Studio
  description: Open a file from /share/bambu in the Bambu Studio panel.
  fields:
    file:
      name: File
      required: true
      selector:
        text: {}
import_url:
  name: Import from a link
  description: Bring a model into /share/bambu/imports from a Printables model page (every
    model file on it) or from a link to an .stl, .3mf, .step, .obj or .amf file. MakerWorld
    needs a signed-in Bambu account, so it is refused with where to open it instead. Answers
    with the imported files' paths, ready for print_file.
  fields:
    url:
      name: Link
      description: The Printables page or the file's own link.
      required: true
      example: https://www.printables.com/model/3161-3d-benchy
      selector:
        text:
          type: url
reconnect:
  name: Reconnect
  description: Drop the add-on's connection to the printer and open a new one, as after the
    printer was switched off and on.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
refresh:
  name: Refresh
  description: 'Ask the printer for a full report now: its state, temperatures and every
    AMS tray (after a spool was changed).'
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
design_part:
  name: Design a part with brAIn
  description: Describe a part and brAIn designs it, builds it and keeps it as a version on
    the Design tab; or name a part and say what to change. Answers as soon as brAIn has
    started, with the part's id and name; designing takes minutes, so ask design_status
    afterwards. Needs brAIn with its Automation integration on.
  fields:
    description:
      name: Description
      description: What the part is, with any sizes that matter.
      example: A wall hook 4 cm long for a coat, two screw holes
      selector:
        text:
          multiline: true
    name:
      name: Name
      description: What to call a new part. Left out, brAIn names it.
      example: Coat hook
      selector:
        text: {}
    part:
      name: Part
      description: A part already designed, by its id or its name, to change instead of
        starting a new one.
      example: Coat hook
      selector:
        text: {}
    message:
      name: Message
      description: What to change about that part.
      example: Make it 6 cm long
      selector:
        text:
          multiline: true
design_status:
  name: Design status
  description: How a designed part is doing — its latest version, whether brAIn is still
    working on it, brAIn's last reply, whether it built, and any print of it — or every
    part when none is named. Changes nothing.
  fields:
    part:
      name: Part
      description: The part, by its id or its name. Left out, every part.
      example: Coat hook
      selector:
        text: {}
print_part:
  name: Print a designed part
  description: Slice a designed part with Bambu Studio's own profiles for the printer and
    the filament in the tray, and send it — the Design tab's Slice and print. Answers
    once it has started; design_status says how the print is going.
  fields:
    part:
      name: Part
      description: The part, by its id or its name.
      required: true
      example: Coat hook
      selector:
        text: {}
    version:
      name: Version
      description: Which version to print. Left out, the current one.
      selector:
        number:
          min: 1
          max: 999
          mode: box
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    slot:
      name: AMS tray
      description: Which AMS tray (0-based) to print from, or external. Left out, the tray
        whose filament best fits the part.
      example: 0
      selector:
        text: {}
    copies:
      name: Copies
      description: How many of it, arranged on the plate.
      selector:
        number:
          min: 1
          max: 50
          mode: box
    timelapse:
      name: Timelapse
      description: Timelapse.
      selector:
        boolean: {}
    settings:
      name: Settings
      description: Print settings over the part's own, as the Design tab's print options
        name them (layer_height, infill_density, wall_loops, supports...).
      example: '{"infill_density": 25}'
      selector:
        object: {}
check_print:
  name: Check the print now
  description: Have brAIn look at the print through the camera now, whatever the plan says.
    Needs failure detection on for the printer, the camera able to see, and brAIn.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
print_alert_action:
  name: Answer a print alert
  description: Answer what failure detection raised — ignore it for the rest of the print,
    pause, resume after a false alarm, or stop — or say the plate is clear.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    action:
      name: Action
      description: What to do.
      required: true
      example: ignore
      selector:
        select:
          options:
            - ignore
            - pause
            - resume
            - stop
            - plate_clear
            - plate_occupied
    alert:
      name: Alert
      description: The alert's id; left out, the open alert.
      selector:
        text: {}
set_failure_detection:
  name: Set print failure detection
  description: Switch print failure detection on or off for a printer and choose how it
    behaves.
  fields:
    printer:
      name: Printer
      description: Which printer, by its name or serial number. Left out when there is only
        one.
      example: Workshop X1C
      selector:
        text: {}
    enabled:
      name: On
      description: Watch this printer's prints.
      selector:
        boolean: {}
    mode:
      name: When a print fails
      description: pause warns and pauses a failed print; warn only warns.
      selector:
        select:
          options:
            - pause
            - warn
    sensitivity:
      name: Sensitivity
      description: How often it looks and how sure it must be.
      selector:
        select:
          options:
            - low
            - medium
            - high
    light:
      name: Turn the light on
      description: Turn the chamber light on when it is too dark to see the print.
      selector:
        boolean: {}
    plate:
      name: Watch the plate
      description: After a print, watch for the plate being cleared.
      selector:
        boolean: {}
    notify:
      name: Notify
      description: The notify service alerts go to (one for every printer); empty for Home
        Assistant's own notifications only.
      example: notify.mobile_app_pixel
      selector:
        text: {}
