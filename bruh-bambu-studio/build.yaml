# Only read by Supervisor versions before 2026.04.0 — newer Supervisors
# ignore build.yaml entirely and use the Dockerfile's own ARG defaults.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm

args:
  ADDON_VERSION: "{{ version }}"

labels:
  org.opencontainers.image.title: "Home Assistant App: BRUH Bambu Studio"
  org.opencontainers.image.description: "Bambu Studio and Bambu Lab printer control for Home Assistant"
  org.opencontainers.image.source: "https://github.com/bruhautomation/BRUH-HA-Apps"
  org.opencontainers.image.licenses: "MIT"
