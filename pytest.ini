# The whole suite is a few seconds: `python3 -m pytest` (never bare `pytest`
# in a Claude Code cloud session, where the one on PATH cannot see the
# dependencies). It holds only what must never break; see CLAUDE.md.
[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
# A hang is a named failure, not a stuck run.
timeout = 20
timeout_method = thread
