# The suite in parallel, which is how it is meant to be run whole:
#
#     python3 -m pytest tests -q -n 4 --dist loadfile
#
# Serial it is about six minutes of wall clock for two of CPU, because most
# of the run is waiting on subprocesses and servers; four workers overlap
# that waiting. `loadfile` keeps one file's tests on one worker, since
# several files pop, reload and re-import panel modules and load the
# integration through tests/brain_ha_env.py — per-file state that spread
# across workers becomes an ordering nobody wrote down.
#
# `-n` is deliberately NOT in addopts: pytest-xdist is a test requirement,
# not a precondition for running a single file, and a contributor without
# it must still get a run rather than an "unrecognized arguments" error.
#
#     python3 -m pytest tests -q -n 4 -m "not slow"   # the fast local run
#     python3 -m pytest --lf                          # what failed last time
#
# Always `python3 -m pytest`: in a Claude Code cloud session the `pytest`
# on PATH is an isolated tool install that cannot see the dependencies.
[pytest]
testpaths = tests
markers =
    slow: spawns subprocesses, real servers or holds locks (or walks the whole source tree); excluded from the fast local run with -m 'not slow'
# A hang is a named failure, not a stuck session. The slowest real test
# measured 7.6s, so 120s catches only a test that will never finish. The
# thread method rather than SIGALRM, because a signal handler only runs
# when the main thread is back in Python bytecode: a test blocked in a C
# call, or one whose code under test catches a broad Exception, swallows
# or never sees the signal's exception. The thread fires regardless, dumps
# every thread's stack (which is where the answer to "waiting on what" is)
# and ends the process; under xdist that is one worker replaced and the
# test reported by name.
timeout = 120
timeout_method = thread
