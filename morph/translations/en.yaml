---
# Option labels and help text for Morph's configuration UI. config.yaml's
# comments are for whoever edits config.yaml; this is what a person reads.
configuration:
  enable_ha_integration:
    name: Install the Morph integration
    description: >-
      Morph is a panel inside Home Assistant, not an ingress add-on, so there
      is no "Show in sidebar" switch on this page. This option installs the
      morph integration that adds it. After the first start, accept the
      "Morph" tile under Settings → Devices & services, then restart Home
      Assistant once; Morph then appears in the sidebar. Turn this off to stop
      Morph deploying anything; your dashboard in /config/morph is left alone.
  learning:
    name: Learn and suggest improvements
    description: >-
      Morph notices how the dashboard is used — what you open, when, what you
      change back — and asks brAIn how it could be better. Suggestions appear
      in place on the dashboard with Do it and Not now; nothing is changed
      until you press Do it. Needs brAIn. You can also change this in Morph's
      own settings.
  report_code_issues:
    name: Report Morph's own problems
    description: >-
      Hand Morph's own faults (a card that fails to draw, a layout that
      overlaps, a request it could not carry out) to brAIn's development
      loop, which files them in your private reports repository so they can
      be fixed in Morph's code. Does nothing unless that loop is switched on
      in brAIn under ⚙ → Developer.
  log_level:
    name: Log level
    description: >-
      Verbosity of the add-on's own logging. "info" is normal.
