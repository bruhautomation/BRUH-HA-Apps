---
name: "Morph"
description: "EXPERIMENTAL, not for general use yet. A dashboard for Home Assistant that moves to make room for whatever you look at, and that brAIn designs, edits and keeps improving with you"
version: "1.1.0"
slug: "morph"
init: false

# Pull the prebuilt image rather than building on the user's machine — the
# same arrangement and the same trap as every add-on here: a version with no
# matching tag on the registry is an add-on that will not install at all.
image: "ghcr.io/bruhautomation/{arch}-morph"

arch:
  - aarch64
  - amd64

url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/morph"

# AppArmor profile — see apparmor.txt. Morph's one unusual need is `git`,
# which it runs on /config/morph so every change to the dashboard is a commit
# Undo can revert.
apparmor: true

boot: auto
startup: services
stage: experimental

homeassistant: "2024.7.0"

# There is no ingress panel and no published port. Morph's screen is a
# Home Assistant CUSTOM PANEL registered by the `morph` integration, because
# it has to run inside Home Assistant's own frontend: that is where the live
# `hass` object, the websocket and Lovelace's card helpers are, and an ingress
# iframe has none of them. The add-on is the half that owns the files — git,
# the brAIn bridge, the learning loop — and it talks to the integration over
# the shared folder, the way every add-on in this repository does.
#
# Its health server binds 127.0.0.1 only, and run.sh polls it (BRight's
# arrangement), so nothing here is reachable from the network at all.

options:
  # enable_ha_integration: deploy the `morph` integration, which is what puts
  # Morph in the sidebar. Off leaves the files alone and shows nothing.
  enable_ha_integration: true

  # learning: notice how the dashboard is used and ask brAIn for improvements,
  # which Morph SUGGESTS in place for you to approve. Nothing it suggests is
  # applied until somebody presses Do it.
  learning: true

  # report_code_issues: hand Morph's own problems (cards that fail to render,
  # layout faults, requests it could not carry out) to brAIn's development
  # loop, which files them in your private reports repository so the cloud
  # routine can fix Morph's code. Does nothing unless that loop is switched on
  # in brAIn.
  report_code_issues: true

  log_level: info
schema:
  enable_ha_integration: bool
  learning: bool
  report_code_issues: bool
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

# /config holds the dashboard (/config/morph, a git repository), the shared
# folder the integration and the add-on talk through (/config/.morph), the
# integration deploy, and brAIn's task folder (/config/.brain).
map:
  - type: homeassistant_config
    read_only: false
    path: /config

hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false

# Registers "morph" with the Supervisor so Home Assistant offers a one-click
# setup tile for the integration — the press that puts Morph in the sidebar.
discovery:
  - morph

# The usage log is how the house moves through its own dashboard; it is
# evidence about a home and stays out of every backup.
backup_exclude:
  - "usage*.jsonl"
