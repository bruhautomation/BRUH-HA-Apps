party_mode:
  name: Start party mode
  description: >-
    Play the configured (or given) music folder on a media player and run
    each track's compiled light show in sync. Fully autonomous — tracks are
    analyzed and choreographed ahead of time.
  fields:
    media_player:
      name: Media player
      description: Which media player plays the music. Defaults to the last one calibrated.
      selector:
        entity:
          domain: media_player
    folder:
      name: Music folder
      description: Folder under /media to play. Defaults to the add-on's music_folder option.
      selector:
        text: {}
    party:
      name: Saved set
      description: >-
        Name of a set saved in the BRight panel. Its speaker, folder, songs,
        light selection and end scene are used; anything given here wins over
        what the set saved.
      selector:
        text: {}
    end_scene:
      name: End scene
      description: >-
        A scene to call when the party stops, instead of restoring every light
        to how it was before. "Everything back as it was" is right when the show
        interrupted an evening and wrong when the show WAS the evening.
      selector:
        entity:
          domain: scene
    shuffle:
      name: Shuffle
      description: Play the folder in a random order. On by default.
      selector:
        boolean: {}

start_party:
  name: Start a saved set
  description: >-
    Run a set saved in the BRight panel, by name. Everything it needs — the
    speaker, the songs or music folder, which lights may join in and what the
    room looks like afterwards — was set up once and is reused. An unknown name
    fails loudly rather than quietly playing the default folder.
  fields:
    party:
      name: Set
      description: The saved set's name, as it appears in the panel's Party tab.
      required: true
      selector:
        text: {}
    media_player:
      name: Media player
      description: Override the speaker this party normally plays on.
      selector:
        entity:
          domain: media_player
    end_scene:
      name: End scene
      description: Override the scene called when this party stops.
      selector:
        entity:
          domain: scene

start_show:
  name: Start a show
  description: Play one track and its compiled light show.
  fields:
    track:
      name: Track
      description: Path of the track under /media.
      required: true
      selector:
        text: {}
    media_player:
      name: Media player
      description: Which media player plays the music. Defaults to the last one calibrated.
      selector:
        entity:
          domain: media_player

stop_show:
  name: Stop the show
  description: >-
    Stop playback and put the room back — restoring every light to its pre-show
    state, or calling a scene if one is given (or if the running party named
    one).
  fields:
    scene:
      name: End scene
      description: >-
        Call this scene instead of restoring the lights. Use it when the show
        was the evening and what comes next is bedtime, rather than whatever
        the lights happened to be doing beforehand.
      selector:
        entity:
          domain: scene
