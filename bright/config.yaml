---
name: "BRight"
description: "Music-driven light show director: analyzes your local music, choreographs LIFX bulbs over the LAN plus switch-driven party lights, and keeps it all in sync with the speaker"
version: "0.13.0"
slug: "bright"
init: false

# Pull the prebuilt image instead of building on the user's machine. Step two
# of the flow the note at the top of .github/workflows/build.yml describes:
# 0.9.0 published ghcr.io/bruhautomation/{arch}-bright for both
# architectures and both packages are Public, so installs can point at them.
#
# This key is load-bearing in a way that is easy to miss — see the longer
# note in brain/config.yaml. With it set the Supervisor stops building and
# pulls, so a version here with no matching tag on the registry, or a
# package that is not Public, is not a slow install, it is an add-on that
# will not install at all. build.yml asks the registry anonymously after
# every push and fails if the answer is not 200.
#
# The image name follows the FOLDER, not the slug (they agree here, but they
# do not for bruh-minecraft-server): build.yml names it after the matrix
# entry, which is the directory it builds.
image: "ghcr.io/bruhautomation/{arch}-bright"

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bright"

# AppArmor profile — see apparmor.txt next to this file. Same shape as the
# other add-ons': deny the host-escape set, allow the add-on's own work.
# Worth more than usual here because host_network puts this container on
# the LAN itself.
apparmor: true

# Boot policy
boot: auto
startup: services
stage: stable

# No `watchdog:` URL here, and that is not an oversight. The Supervisor's
# placeholder syntax needs a port number written into this file
# ([PORT:8095]) and this add-on no longer owns one — `ingress_port: 0` below
# hands the choice to the Supervisor. A watchdog still pinned to 8095 would
# poll whatever service actually holds 8095 on the host and restart BRight on
# a stranger's behalf, which is worse than not watching at all. A hung panel
# is still caught: run.sh polls /api/health on loopback, where it knows the
# real port, and takes the add-on down so the Supervisor's restart-on-stop
# brings it back.

# Compiled shows and analysis caches are regenerable build output — a backup
# that carries them is bigger for nothing. Paths are relative to /data.
backup_exclude:
  - shows/**
  - cache/**

homeassistant: "2023.6.0"

# Web interface configuration (ingress panel).
#
# ingress_port: 0 means "Supervisor, pick a free host port and tell me which
# one" — the documented arrangement for an add-on on the host network, and
# the only one that is true on every box. With host_network the panel binds a
# REAL host port, so any number written here is a number some other add-on or
# service may already own: 8099 is BRUH Minecraft's, and 8095 — this add-on's
# first answer to that — turned out to be somebody else's on a real install,
# which crash-looped the panel on `[Errno 98] address in use` with no way
# out. The panel reads the assigned port back from /addons/self/info at
# startup; panel/panel_port.py is the one place that lookup lives.
ingress: true
ingress_port: 0
panel_icon: mdi:track-light
panel_title: "BRight"
panel_admin: true

# LIFX networking.
# host_network: true is REQUIRED for direct LIFX LAN control — discovery is
# a UDP broadcast on port 56700 and the replies come back to the sender's
# own address, and Docker's bridge network drops both directions. Host
# networking is also what makes the latency story true: cue packets go
# straight onto the LAN with no NAT translation in the path. Ingress (the
# panel) still works because the Supervisor proxies it internally — but the
# panel is then reachable from the LAN too, which is why panel/server.py
# gates EVERY route on the socket's peer address (see _lan_gate) — with the
# watchdog gone, nothing outside Home Assistant has a reason to reach the
# panel, so no prefix is public any more.
host_network: true

# ============================================================================
# App configuration options
# ----------------------------------------------------------------------------
# Every option below is documented inline for whoever edits this file; the
# text users actually see lives in translations/en.yaml. Validation rules
# are in the `schema:` block.
# ============================================================================
options:
  # music_folder: where the music library lives, under HA's /media mount.
  # BRight scans this folder for tracks to analyze, and hands the same files
  # to the media player through media-source URLs when a show runs.
  music_folder: /media/music

  # additional_music_folders: more folders to scan, beside music_folder.
  # Every one of them has to be under /media, and that is not an arbitrary
  # confinement: a show plays its track by handing the media player a
  # media-source URI, which Home Assistant only serves for files under the
  # media folder. A folder outside it would analyze perfectly and never
  # play a note. Subfolders need no entry — each folder is scanned all the
  # way down — and overlapping folders cost nothing, because tracks are
  # de-duplicated by content hash.
  additional_music_folders: []

  # director_mode: who choreographs a track's show.
  #   auto        — Claude designs the show when a Claude Code login is
  #                 available, and the built-in algorithmic choreographer is
  #                 the fallback (recommended).
  #   algorithmic — never call Claude; rule-based choreography only.
  #   claude      — Claude only; compiling fails without a working login
  #                 rather than silently downgrading.
  director_mode: auto

  # enable_ha_integration: deploy the companion `bright` custom integration
  # and run the file-IPC bridge, exposing bright.party_mode / start_show /
  # stop_show services and a show-status sensor to Home Assistant.
  enable_ha_integration: true

  # log_level: verbosity of the add-on's own logging.
  log_level: info
schema:
  music_folder: "match(^/media(/.*)?$)"
  additional_music_folders:
    - "match(^/media(/.*)?$)"
  director_mode: "list(auto|algorithmic|claude)"
  enable_ha_integration: bool
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

# Volume mappings. /config carries the custom integration deploy and the
# shared IPC dir; /media carries the music library and the calibration
# reference track (which the media player has to be able to fetch).
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - media:rw

# API access for the Home Assistant integration
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false

# Auto-discovery: registers "bright" with the Supervisor so HA Core can
# offer to set up the companion integration.
discovery:
  - bright
