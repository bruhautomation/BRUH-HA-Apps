---
# Option labels and help text for BRight's configuration UI.
#
# config.yaml documents every option inline and none of it reaches the
# person filling in the form. This file is that documentation, moved to
# where it is read.
configuration:
  music_folder:
    name: Music folder
    description: >-
      Where your music lives, under Home Assistant's /media folder
      (e.g. /media/music). BRight scans this folder for tracks to analyze
      and plays the same files through your media player during a show.
  additional_music_folders:
    name: Extra music folders
    description: >-
      More folders to scan for music, one per line, beside the music folder
      above (e.g. /media/parties). They must be under /media: a show plays
      its track by handing your media player a media-source link, and Home
      Assistant only serves those for files in its media folder. Subfolders
      are already included — each folder is scanned all the way down.
  director_model:
    name: Director model
    description: >-
      The Claude model choreography runs on — writing a show, writing or
      inventing effects, and revising a show from feedback. "opus" (the
      default) is the strongest tier and shows are written rarely, so the
      cost lands where the quality shows. Any model id brAIn's Claude
      accepts works here.
  director_mode:
    name: Show director
    description: >-
      Who choreographs each track. "auto" lets Claude design the show when
      a Claude Code login is available and falls back to the built-in
      algorithmic choreographer; "algorithmic" never calls Claude;
      "claude" requires a working login and fails rather than downgrading.
  enable_ha_integration:
    name: Home Assistant integration
    description: >-
      Deploy the companion bright integration, which adds the
      bright.party_mode, bright.start_show and bright.stop_show services and
      a show-status sensor so automations can run the lights.
  log_level:
    name: Log level
    description: >-
      Verbosity of the add-on's own logging. "info" is normal; use
      "debug" when diagnosing a problem.
