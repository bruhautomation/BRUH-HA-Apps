# Only read by Supervisor versions before 2026.04.0 — newer Supervisors
# ignore build.yaml entirely and use the Dockerfile's own ARG defaults.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24
  amd64: ghcr.io/home-assistant/amd64-base:3.24

# Passes the version from config.yaml into the Dockerfile ARG so run.sh can
# print it in the startup banner.
args:
  ADDON_VERSION: "{{ version }}"

labels:
  org.opencontainers.image.title: "Home Assistant App: BRight"
  org.opencontainers.image.description: "Music-driven light show director for LIFX and switch-driven party lights"
  org.opencontainers.image.source: "https://github.com/bruhautomation/BRUH-HA-Apps"
  org.opencontainers.image.licenses: "MIT"
