---
name: "BRUH Insights"
description: "AI-powered insights dashboard — Claude analyzes your Home Assistant data and generates beautiful interactive visualizations in the sidebar"
version: "1.3.1"
slug: "bruh_insights"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bruh-insights"

# Web interface configuration (ingress panel in the sidebar)
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: "BRUH Insights"
panel_admin: true

# Optional dashboard-card server: serves each insight's visualization as a
# token-protected HTML page so HA "Webpage" dashboard cards can embed live
# insights. Disabled (unmapped) by default — map it in the add-on's Network
# settings to use "Add to dashboard" from the panel.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Dashboard card server (token-protected insight HTML for Webpage cards)"

# App configuration options
options:
  auto_refresh_hours: 6
  history_days: 7
  history_keep_runs: 40
  history_keep_days: 30
  model: ""
  generation_timeout_minutes: 8
  log_level: info
schema:
  auto_refresh_hours: "int(0,168)?"
  history_days: "int(1,30)?"
  history_keep_runs: "int(0,200)?"
  history_keep_days: "int(0,365)?"
  model: "str?"
  generation_timeout_minutes: "int(2,30)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"

# Read-only view of the HA config directory. Used to pick up the CLAUDE.md
# home context and the shared memory/credential files that BRUH Terminal
# maintains (if installed). Never written to.
# /share is writable: when the bruh_claude integration isn't installed,
# learned findings are dropped into /share/bruh_claude/memory-inbox/ for
# the BRUH Terminal add-on to ingest.
map:
  - type: homeassistant_config
    read_only: true
    path: /config
  - type: share
    read_only: false

# API access for Home Assistant data collection (states, history,
# statistics, registries) via the Supervisor proxy
hassio_api: true
homeassistant_api: true

# Service startup configuration
startup: services
