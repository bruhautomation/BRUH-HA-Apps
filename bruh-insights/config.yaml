---
name: "BRUH Insights"
description: "AI-powered insights dashboard — Claude analyzes your Home Assistant data and generates beautiful interactive visualizations in the sidebar"
version: "1.9.0"
slug: "bruh_insights"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bruh-insights"

# Web interface configuration (ingress panel in the sidebar)
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: "BRUH Insights"
panel_admin: true

# Dashboard cards need no port: insight HTML is mirrored to
# /config/www/bruh_insights/ (see `map` below) and served by Home Assistant
# itself at /local/…, which works on HTTP, HTTPS, and Nabu Casa dashboards
# alike.

# App configuration options. Everything except log_level is also editable
# from the panel's ⚙ Settings dialog, and the two stay in sync: the panel
# reads these values live and writes changes back here through the
# Supervisor (/addons/self/options), so whichever screen you use shows the
# same value and takes effect immediately — no restart.
options:
  auto_refresh_hours: 24
  history_days: 7
  history_keep_runs: 40
  history_keep_days: 30
  model: ""
  generation_timeout_minutes: 8
  log_level: info
schema:
  auto_refresh_hours: "int(0,168)?"
  history_days: "int(1,30)?"
  history_keep_runs: "int(0,200)?"
  history_keep_days: "int(0,365)?"
  model: "str?"
  generation_timeout_minutes: "int(2,30)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"

# HA config directory. Read for the CLAUDE.md home context and the shared
# credential file BRUH Terminal maintains (if installed). Writable for TWO
# purposes: the panel's Memory editor maintains the home memory file at
# /config/.bruh_claude/memory/memory.md (shared with BRUH Terminal's
# ha-memory), and — only once dashboard cards are first used — insight HTML
# is mirrored to /config/www/bruh_insights/ so HA serves it at /local/…
# (same-origin Webpage cards that also work over HTTPS/Nabu Casa). Nothing
# else under /config is ever written.
# /share is writable: when the bruh_claude integration isn't installed,
# learned findings are dropped into /share/bruh_claude/memory-inbox/ for
# the BRUH Terminal add-on to ingest.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false

# API access for Home Assistant data collection (states, history,
# statistics, registries) via the Supervisor proxy
hassio_api: true
homeassistant_api: true

# Service startup configuration
startup: services
