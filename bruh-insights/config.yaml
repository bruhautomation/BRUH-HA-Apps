---
name: "BRUH Insights"
description: "AI-powered insights dashboard — Claude analyzes your Home Assistant data and generates beautiful interactive visualizations in the sidebar"
version: "1.0.3"
slug: "bruh_insights"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps/tree/main/bruh-insights"

# Web interface configuration (ingress panel in the sidebar)
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: "Insights"
panel_admin: true

# App configuration options
options:
  auto_refresh_hours: 6
  history_days: 7
  model: ""
  generation_timeout_minutes: 8
  log_level: info
schema:
  auto_refresh_hours: "int(0,168)?"
  history_days: "int(1,30)?"
  model: "str?"
  generation_timeout_minutes: "int(2,30)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"

# Read-only view of the HA config directory. Used to pick up the CLAUDE.md
# home context that BRUH Claude Terminal generates (if installed) so insights
# know about the user's naming conventions and setup. Never written to.
map:
  - type: homeassistant_config
    read_only: true
    path: /config

# API access for Home Assistant data collection (states, history,
# statistics, registries) via the Supervisor proxy
hassio_api: true
homeassistant_api: true

# Service startup configuration
startup: services
