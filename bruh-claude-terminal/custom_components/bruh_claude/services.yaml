send_prompt:
  name: Send prompt
  description: Send a one-shot prompt to Claude and get a response.
  fields:
    prompt:
      name: Prompt
      description: The prompt text to send to Claude.
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Claude model override (default, sonnet, opus, haiku).
      selector:
        select:
          options:
            - default
            - sonnet
            - opus
            - haiku
    timeout:
      name: Timeout
      description: Maximum seconds to wait for a response (default 120).
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds

run_task:
  name: Run task
  description: Run a Claude task with optional completion notification.
  fields:
    prompt:
      name: Prompt
      description: The task prompt for Claude.
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Claude model override (default, sonnet, opus, haiku).
      selector:
        select:
          options:
            - default
            - sonnet
            - opus
            - haiku
    notify:
      name: Notify on completion
      description: Send a persistent notification when the task completes.
      default: false
      selector:
        boolean:
    notify_entity:
      name: Notification entity
      description: The notify entity to use (e.g. notify.mobile_app_phone).
      selector:
        text:
    timeout:
      name: Timeout
      description: Maximum seconds to wait for the task to complete (default 120).
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds

clear_conversation:
  name: Clear conversation
  description: Clear a persistent Claude conversation session. This resets the conversation history so the next message starts fresh. If no conversation_id is provided, ALL sessions are cleared.
  fields:
    conversation_id:
      name: Conversation ID
      description: The conversation ID to clear. Leave empty to clear all sessions.
      selector:
        text:

run_insight:
  name: Run insight job
  description: Run a configured insight job now (refreshes its sensor and markdown). Leave name empty to run all insight jobs.
  fields:
    name:
      name: Job name
      description: The insight job's name (the config entry title). Empty runs every job.
      selector:
        text:

add_memory:
  name: Add memory fact
  description: Queue a durable fact about your home for Claude's long-term memory (merged into /config/.bruh_claude/memory/memory.md by the consolidator).
  fields:
    fact:
      name: Fact
      description: The fact to remember, e.g. "We call the office lamp 'the beacon'".
      required: true
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Where this fact came from (defaults to "service").
      selector:
        text:
    confidence:
      name: Confidence
      description: How certain the fact is (defaults to medium).
      selector:
        select:
          options:
            - high
            - medium
            - low

answer_question:
  name: Answer memory question
  description: Answer an open question from Claude's memory system. The answer is recorded and also queued as a memory fact.
  fields:
    question:
      name: Question
      description: The open question being answered (as shown by ha-memory questions).
      required: true
      selector:
        text:
          multiline: true
    answer:
      name: Answer
      description: Your answer.
      required: true
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Where this answer came from (defaults to "service").
      selector:
        text:
