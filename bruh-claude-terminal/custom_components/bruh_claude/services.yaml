send_prompt:
  name: Send prompt
  description: Send a one-shot prompt to Claude and get a response.
  fields:
    prompt:
      name: Prompt
      description: The prompt text to send to Claude.
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Claude model override (default, sonnet, opus, haiku).
      selector:
        select:
          options:
            - default
            - sonnet
            - opus
            - haiku
    timeout:
      name: Timeout
      description: Maximum seconds to wait for a response (default 120).
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds

run_task:
  name: Run task
  description: Run a Claude task with optional completion notification.
  fields:
    prompt:
      name: Prompt
      description: The task prompt for Claude.
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Claude model override (default, sonnet, opus, haiku).
      selector:
        select:
          options:
            - default
            - sonnet
            - opus
            - haiku
    notify:
      name: Notify on completion
      description: Send a persistent notification when the task completes.
      default: false
      selector:
        boolean:
    notify_entity:
      name: Notification entity
      description: The notify entity to use (e.g. notify.mobile_app_phone).
      selector:
        text:
    timeout:
      name: Timeout
      description: Maximum seconds to wait for the task to complete (default 120).
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds

clear_conversation:
  name: Clear conversation
  description: Clear a persistent Claude conversation session. This resets the conversation history so the next message starts fresh. If no conversation_id is provided, ALL sessions are cleared.
  fields:
    conversation_id:
      name: Conversation ID
      description: The conversation ID to clear. Leave empty to clear all sessions.
      selector:
        text:

run_insight:
  name: Run insight job
  description: Run a configured insight job now (refreshes its sensor and markdown). Leave name empty to run all insight jobs.
  fields:
    name:
      name: Job name
      description: The insight job's name (the config entry title). Empty runs every job.
      selector:
        text:
