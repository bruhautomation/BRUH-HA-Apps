# BRUH Claude Terminal tmux configuration

# Use the inherited terminal type
set-option -g default-terminal $TERM

# Ensure HA environment variables are passed through to new windows/panes
set-option -ga update-environment "SUPERVISOR_TOKEN HA_TOKEN HA_BASE_URL SUPERVISOR_API_URL ANTHROPIC_CONFIG_DIR ANTHROPIC_HOME XDG_CONFIG_HOME XDG_CACHE_HOME XDG_STATE_HOME XDG_DATA_HOME"

# Start window and pane numbering at 1
set-option -g base-index 1
setw -g pane-base-index 1

# Status bar styling
set -g status-style "fg=white,bg=colour236"
set -g status-left '[BRUH] '
set -g status-right '#S | %a %m-%d %H:%M'
set -g status-left-length 20

# Mouse support — only enable when NOT running under ttyd.
#
# Enabling `set -g mouse on` makes tmux ask the terminal emulator
# (xterm.js via ttyd) to forward mouse events as escape sequences via
# DECSET 1000 / 1002 / 1006. That lets the WheelUpPane binding below
# auto-enter copy mode and scroll through tmux's per-pane history —
# which is the only thing on the stack capturing Claude Code's alt-
# screen chat. Useful!
#
# Unfortunately the same DECSET makes xterm.js *disable native browser
# text selection*, because mouse drag events are now PTY events
# instead of selection. On desktop the user can hold Shift while
# dragging to bypass, but on mobile (iOS HA Companion app
# specifically) there's no shift key, so dragging produces a tmux
# "flash" (tmux enters copy mode and finishes it on drag-end via the
# default copy-selection-and-cancel binding) but nothing reaches the
# system clipboard. That kills the OAuth-URL-copy workflow.
#
# 1.18.7 enabled mouse on unconditionally and broke the OAuth flow.
# 1.18.8 reverted that. For now we keep the gate, lose swipe-to-
# scroll, and provide an explicit `📜 Hist` toolbar button in
# ttyd-assets/inject.html that sends `Ctrl+B [` to enter copy mode
# manually — once in copy mode the user uses the existing ↑↓ buttons
# (or PgUp/PgDn) to scroll and `ESC` to exit.
if-shell '[ -z "$TTYD" ]' {
    set -g mouse on
}

# OSC 52 clipboard support
set -g set-clipboard on
set -g allow-passthrough on

# Increase scroll-back buffer
set -g history-limit 50000

# Faster escape time for better responsiveness
set -sg escape-time 0

# vi-style keys in copy mode
setw -g mode-keys vi

# Copy mode mouse bindings
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Double-click word selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word

# Triple-click line selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line
