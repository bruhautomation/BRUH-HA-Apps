---
name: "BRUH Claude Terminal"
description: "Enhanced Claude Code terminal for Home Assistant with native HA API access, auto-backup, context generation, and Assist integration"
version: "1.17.4"
slug: "bruh_claude_terminal"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/bruhautomation/BRUH-HA-Apps"

# Web interface configuration
ingress: true
ingress_port: 7681
panel_icon: mdi:creation
panel_title: "BRUH Claude"
panel_admin: true

# Port configuration
ports:
  7681/tcp: 7681
ports_description:
  7681/tcp: "Web terminal (not required for ingress)"

# App configuration options
options:
  auto_launch_claude: true
  auto_backup: true
  auto_generate_context: true
  backup_interval_minutes: 30
  enable_ha_mcp_server: true
  enable_assist_integration: true
  enable_automation_integration: true
  enable_mobile_ui: true
  dangerously_skip_permissions: false
  assist_max_turns: 5
  automation_max_turns: 10
  access_share: true
  access_media: true
  access_backup: true
  access_addon_configs: true
  access_addons: true
  additional_directories: []
  persistent_apk_packages: []
  persistent_pip_packages: []
  log_level: info
schema:
  auto_launch_claude: bool?
  auto_backup: bool?
  auto_generate_context: bool?
  backup_interval_minutes: "int(5,1440)?"
  enable_ha_mcp_server: bool?
  enable_assist_integration: bool?
  enable_automation_integration: bool?
  enable_mobile_ui: bool?
  dangerously_skip_permissions: bool?
  assist_max_turns: "int(1,20)?"
  automation_max_turns: "int(1,50)?"
  access_share: bool?
  access_media: bool?
  access_backup: bool?
  access_addon_configs: bool?
  access_addons: bool?
  additional_directories:
    - str
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"

# Volume mappings for file access
map:
  - config:rw
  - share:rw
  - media:rw
  - backup:ro
  - all_addon_configs:rw
  - addons:rw

# API access for Home Assistant integration
hassio_api: true
hassio_role: admin
homeassistant_api: true
auth_api: true

# Auto-discovery: registers "bruh_claude" service with the Supervisor
# so HA Core can auto-discover and offer to set up the companion integration
discovery:
  - bruh_claude

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7681]/
