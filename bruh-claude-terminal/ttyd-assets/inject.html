<!-- BRUH Claude mobile toolbar + iOS dictation diff-fix.
     Injected into ttyd's <head> by scripts/build-mobile-index.py so this
     runs BEFORE ttyd's inline bundle (both are inline <script> blocks and
     inline scripts execute in document order). -->
<style>
  #bruh-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2147483600;
    background: #241d18;
    border-top: 1px solid #3a2e25;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    scrollbar-width: none;
    /* Body sets `touch-action: none` so the terminal scroll forwarder
       has exclusive control of the gesture. Re-allow horizontal pan
       inside the toolbar so the user can still swipe between keys when
       the row overflows. */
    touch-action: pan-x;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #bruh-bar::-webkit-scrollbar { display: none; }

  body.bruh-is-touch #bruh-bar { display: block; }
  body.bruh-bar-hidden #bruh-bar { display: none !important; }

  /* Reserve space at the bottom of the viewport for the toolbar +
     on-screen keyboard. We do this by SHRINKING THE BODY'S BOX, not
     by padding body's content area.
     Why this matters: ttyd's CSS does `#terminal-container { height:
     100% }` and `.terminal { height: calc(100% - 10px) }`, both
     measured against body's *box*, not body's content box. So body
     `padding-bottom` carves space inside body but leaves
     terminal-container the full height of body — xterm.fit() never
     sees the smaller area, ttyd never sends new (cols, rows) to the
     PTY, tmux doesn't reflow, and claude-code's input row stays
     drawn below the keyboard.
     Shrinking body itself propagates the resize through ttyd's
     terminal-container → .terminal → xterm.fit() ResizeObserver →
     ttyd's WebSocket-side resize message → PTY winsize → tmux
     SIGWINCH → claude-code re-render, so the input row lands above
     the bar + keyboard. */
  body.bruh-is-touch {
    height: calc(100% - var(--bruh-bar-h, 56px));
    min-height: 0;
  }
  body.bruh-is-touch.bruh-bar-hidden { height: 100%; }

  /* iOS Safari (especially inside HA ingress' iframe) auto-scrolls the
     iframe document when the keyboard opens to keep the focused xterm
     textarea in view — and `position: fixed` inside an iframe scrolls
     *with* the document on iOS, so the toolbar drifts to the middle of
     the screen and xterm's `.xterm-viewport` slides out from under the
     user's finger (which is why scrollback stops responding to touch).

     Body lock blocks the auto-scroll so the bar stays anchored to the
     visual viewport. `overscroll-behavior: none` kills the rubber-band
     bounce. We keep position:fixed on <body> only — CSS treats
     position:fixed on the root <html> inconsistently across WebViews
     (works in Mobile Safari, ignored in some Android WebViews, breaks
     the Android adjustResize keyboard reflow inside HA Companion).
     overflow:hidden on <html> is enough to stop scrolling and is well-
     supported everywhere. */
  html.bruh-is-touch {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body.bruh-is-touch {
    /* Anchored to top of viewport; the previous rule above sets
       height: calc(100% - var(--bruh-bar-h, 56px)) so body's box ends
       above where the toolbar + keyboard will be. No `bottom` /
       `inset` here — height + top is the constraint that produces the
       layout, and adding bottom would over-constrain. */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    /* Block ALL native touch panning in the body chrome. xterm-viewport
       is a sibling of xterm-screen (not an ancestor of the canvas the
       user actually touches), so iOS's "walk up the ancestor chain to
       find a scrollable container" search runs past every overflow:
       hidden element in the iframe and hands the gesture to the parent
       HA frontend — which is why the HA panel header used to slide off
       the screen when the user dragged inside the terminal. Our JS
       below drives `.xterm-viewport.scrollTop` directly instead. The
       toolbar and `.bruh-key` opt back in to `pan-x` / `manipulation`
       respectively so they keep working. */
    touch-action: none;
  }

  /* Scrollback lives on xterm's own viewport; make sure touch reaches
     it and that vertical pans aren't stolen by parent gesture handlers. */
  body.bruh-is-touch .xterm-viewport {
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    touch-action: pan-y !important;
  }

  .bruh-key {
    display: inline-block;
    min-width: 44px;
    height: 36px;
    line-height: 36px;
    padding: 0 10px;
    margin: 0 2px;
    background: #1a1613;
    color: #e8ddd4;
    border: 1px solid #3a2e25;
    border-radius: 6px;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    vertical-align: middle;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    /* `manipulation` opts out of iOS's 300ms double-tap-zoom delay and
       prevents the keyboard from being dismissed mid-tap. */
    touch-action: manipulation;
    cursor: pointer;
    transition: background 0.08s, border-color 0.08s, color 0.08s;
  }
  .bruh-key:active,
  .bruh-key.bruh-pressed { background: #d97757; border-color: #d97757; color: #1a1613; }
  .bruh-key.bruh-primary { background: #a85638; border-color: #d97757; color: #fff; }
  .bruh-key.bruh-primary:active { background: #d97757; }
  .bruh-key.bruh-hide-btn { min-width: 36px; padding: 0 8px; color: #a89b90; }
</style>
<script>
(function () {
  'use strict';

  // ===================================================================
  // 1. Capture ttyd's WebSocket so the toolbar can send raw stdin.
  //    Runs before ttyd's inline bundle (<head> vs <body>), so the
  //    constructor wrap is in place when ttyd calls `new WebSocket(...)`.
  //    ttyd stdin protocol: binary frame `TextEncoder.encode('0' + data)`.
  // ===================================================================
  var ttydSocket = null;
  var OrigWS = window.WebSocket;
  var enc = new TextEncoder();

  function WrappedWS(url, protocols) {
    var ws = protocols === undefined ? new OrigWS(url) : new OrigWS(url, protocols);
    if (String(url).indexOf('/ws') !== -1) ttydSocket = ws;
    return ws;
  }
  WrappedWS.prototype = OrigWS.prototype;
  WrappedWS.CONNECTING = OrigWS.CONNECTING;
  WrappedWS.OPEN       = OrigWS.OPEN;
  WrappedWS.CLOSING    = OrigWS.CLOSING;
  WrappedWS.CLOSED     = OrigWS.CLOSED;
  window.WebSocket = WrappedWS;

  function sendInput(data) {
    if (!ttydSocket || ttydSocket.readyState !== 1) return;
    try { ttydSocket.send(enc.encode('0' + data)); } catch (e) { /* closed */ }
  }

  // ===================================================================
  // 2. iOS dictation duplicate-text fix — the actual reason voice
  //    input was broken.  WebKit bug 261764: on iOS Safari / WKWebView
  //    voice dictation NEVER fires composition events.  Instead, each
  //    interim transcript arrives as a plain `input` event whose
  //    textarea `value` contains the WHOLE cumulative transcript so far
  //    ("t", "tes", "testing", "testing, can you", ...).  xterm.js
  //    forwards every `ev.data` to the PTY verbatim, so saying
  //    "testing, can you hear me" on iOS produces
  //    "ttesttestingtesting, can youtesting, can you hear me...".
  //
  //    Fix: register a capture-phase `input` listener on `document`.
  //    The DOM spec says ancestor capture listeners fire BEFORE
  //    target-level capture listeners — and xterm's own listener is
  //    attached on the textarea in capture phase, so we win.  We diff
  //    the current textarea value against the last value we forwarded,
  //    send backspaces for any retracted characters and the new tail,
  //    then `stopImmediatePropagation` so xterm never sees the event.
  //
  //    1.18.0: gate the diff-and-send on "no recent keydown AND not in
  //    IME composition" — otherwise this handler *also* fires for
  //    every desktop keystroke (which xterm already converted to PTY
  //    bytes via its own keydown handler), doubling every character.
  //    iOS dictation produces input events with neither a preceding
  //    keydown nor an active composition, so this reliably tells
  //    "actual voice/IME input that needs our help" apart from
  //    "ordinary typing xterm already handled".
  // ===================================================================
  var lastValue = '';
  var lastKeyDownAt = 0;
  var inComposition = false;

  // Track keydown so we know which input events to ignore. Capture
  // phase + document-level matches our input listener so timing is
  // tight (no event bubbling latency between the two).
  document.addEventListener('keydown', function () {
    lastKeyDownAt = Date.now();
  }, true);
  document.addEventListener('compositionstart', function () {
    inComposition = true;
  }, true);
  document.addEventListener('compositionend', function () {
    inComposition = false;
  }, true);

  function diffAndSend(newValue) {
    if (newValue === lastValue) return;
    var i = 0;
    var minLen = Math.min(newValue.length, lastValue.length);
    while (i < minLen && newValue.charCodeAt(i) === lastValue.charCodeAt(i)) i++;
    var removed = lastValue.length - i;
    var added   = newValue.slice(i);
    for (var b = 0; b < removed; b++) sendInput('\x7f'); // DEL / backspace
    if (added) sendInput(added);
    lastValue = newValue;
  }

  function onDocumentInputCapture(e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('xterm-helper-textarea')) return;

    // Real keyboard input: xterm already sent the character via its
    // keydown handler. Don't duplicate it. The 100ms window is
    // generous enough for slow event loops but tight enough not to
    // swallow genuine voice/IME input that happens to follow a
    // recent keypress.
    if (Date.now() - lastKeyDownAt < 100) return;

    // IME composition (Japanese/Chinese/Korean keyboards on desktop):
    // xterm handles these via compositionend. Skip during composition
    // and let xterm do its job.
    if (inComposition) return;

    // What's left: voice dictation on iOS (or any other input event
    // that fires without a paired keydown). Diff against last value
    // and send the delta.
    diffAndSend(t.value || '');
    e.stopImmediatePropagation();

    // Keep the textarea from growing unbounded — iOS dictation will
    // otherwise keep re-delivering an ever-longer transcript.  Clear on
    // the next tick so we don't interrupt the current event dispatch.
    var ta = t;
    setTimeout(function () {
      if (ta.value && ta.value.length > 64) {
        ta.value = '';
        lastValue = '';
      }
    }, 0);
  }
  document.addEventListener('input', onDocumentInputCapture, true);

  // Also hint iOS to stop rewriting the stream via autocorrect/predictive.
  // These attributes only apply after xterm creates the textarea, so we
  // set them from the MutationObserver below.
  function patchTextareaAttrs(ta) {
    if (ta.dataset.bruhPatched) return;
    ta.dataset.bruhPatched = '1';
    ta.setAttribute('autocorrect', 'off');
    ta.setAttribute('autocapitalize', 'off');
    ta.setAttribute('autocomplete', 'off');
    ta.setAttribute('spellcheck', 'false');
  }

  // ===================================================================
  // 3. Mobile toolbar.  React renders into `document.body` (wiping
  //    anything we put there) so we can't ship DOM in the HTML.  We
  //    wait until xterm's `.xterm-helper-textarea` appears, then append
  //    a `position: fixed` toolbar — React won't touch it because it
  //    lives outside React's virtual-DOM root at that point.
  // ===================================================================
  // Each key maps to the exact byte sequence sent over the ttyd stdin
  // WebSocket — control codes for Ctrl-X combos, CSI sequences for arrows
  // and Shift+Tab, literal characters for Claude Code prefixes.
  var KEYS = {
    'esc':   '\x1b',     // cancel / close menu
    'tab':   '\x09',     // completion / menu nav
    'shtab': '\x1b[Z',   // Shift+Tab — Claude Code mode toggle
    'up':    '\x1b[A',
    'down':  '\x1b[B',
    'right': '\x1b[C',
    'left':  '\x1b[D',
    'ctrlc': '\x03',     // interrupt
    'ctrld': '\x04',     // EOF / exit
    'ctrll': '\x0c',     // clear screen
    'ctrlu': '\x15',     // clear line
    'slash': '/',        // slash-command menu
    'at':    '@',        // file reference
    'hash':  '#',        // add to memory
    'bang':  '!',        // bash mode
    'pipe':  '|'
  };

  function buildToolbar() {
    if (document.getElementById('bruh-bar')) return;

    var bar = document.createElement('div');
    bar.id = 'bruh-bar';
    bar.setAttribute('role', 'toolbar');
    bar.setAttribute('aria-label', 'Mobile terminal controls');

    // Dedicated one-tap buttons, scrollable horizontally.  No sticky
    // modifiers — every tap sends a complete command on its own.
    // Special keys ('kbdown', 'paste', 'hide') don't have entries in
    // KEYS; handleKey() dispatches them directly.
    var spec = [
      { k: 'esc',    l: 'ESC',     primary: true },
      { k: 'kbdown', l: '▾ Kbd'                  },
      { k: 'tab',    l: 'Tab'                    },
      { k: 'shtab',  l: '⇧Tab'                   },
      { k: 'up',     l: '↑'                      },
      { k: 'down',   l: '↓'                      },
      { k: 'left',   l: '←'                      },
      { k: 'right',  l: '→'                      },
      { k: 'ctrlc',  l: '^C'                     },
      { k: 'ctrld',  l: '^D'                     },
      { k: 'ctrll',  l: '^L'                     },
      { k: 'ctrlu',  l: '^U'                     },
      { k: 'slash',  l: '/'                      },
      { k: 'at',     l: '@'                      },
      { k: 'hash',   l: '#'                      },
      { k: 'bang',   l: '!'                      },
      { k: 'pipe',   l: '|'                      },
      { k: 'paste',  l: 'Paste'                  },
      { k: 'hide',   l: '×',       hide: true    }
    ];
    spec.forEach(function (s) {
      var key = document.createElement('span');
      key.className = 'bruh-key'
        + (s.primary ? ' bruh-primary' : '')
        + (s.hide ? ' bruh-hide-btn' : '');
      key.setAttribute('data-bruh-key', s.k);
      key.textContent = s.l;
      bar.appendChild(key);
    });
    document.body.appendChild(bar);

    // Update `--bruh-bar-h` to (bar height + keyboard gap). The body
    // CSS rule above turns that into `height: calc(100% - var(...))`,
    // which shrinks body's box so ttyd's `#terminal-container { height:
    // 100% }` and `.terminal { height: calc(100% - 10px) }` (both
    // measured against body's box) shrink in lockstep — which is what
    // makes xterm.fit() pick up the smaller area and tell ttyd to
    // resize the PTY (SIGWINCH → tmux reflow → claude-code redraw
    // above the keyboard).
    //
    // After updating the variable we also dispatch a `resize` event on
    // the window. Most modern xterm-fit-addon integrations attach a
    // ResizeObserver to the terminal element and re-fit automatically
    // when its size changes, but the ttyd bundle has historically
    // re-fit on the standard window `resize` event — belt-and-
    // suspenders so the chain runs no matter which path the bundled
    // version uses.
    function syncHeight(gap) {
      if (!bar.isConnected) return;
      var h = bar.offsetHeight;
      if (!h) return;
      var total = h + (gap > 0 ? gap : 0);
      var prev = parseFloat(
        document.documentElement.style.getPropertyValue('--bruh-bar-h')
      ) || 0;
      if (Math.abs(total - prev) < 0.5) return;
      document.documentElement.style.setProperty('--bruh-bar-h', total + 'px');
      try { window.dispatchEvent(new Event('resize')); } catch (_e) { /* IE fallback not needed */ }
    }

    // Keep the bar above the software keyboard.
    //
    // The naive approach is to read `window.visualViewport` — but we're
    // almost always running INSIDE an iframe (Home Assistant's ingress
    // panel embeds us at /api/hassio_ingress/<token>/). On iOS Safari /
    // WKWebView, the keyboard event does NOT resize the inner frame's
    // visualViewport; only the top frame sees it. `window.visualViewport`
    // inside the iframe returns the unchanged frame size and `gap`
    // comes out 0, so without help the bar would stay pinned to the
    // (layout) bottom and get buried under the keyboard.
    //
    // HA ingress serves the iframe from the same origin as the main
    // frontend (`/api/hassio_ingress/...` under the HA host), so we
    // can legally walk up via `window.parent` and read the top
    // viewport. When that path fails we look at our own visualViewport
    // and, failing that, ask whether `window.innerHeight` has shrunk
    // since the page settled — which is how we detect the HA Companion
    // app's keyboard avoidance (it resizes the WebView frame rather
    // than overlaying, so neither visualViewport reports a gap but
    // the layout is already correct).
    //
    // Versions 1.17.3 – 1.18.1 also had a heuristic that translated
    // the bar up by a hard-coded 310 / 210 px whenever the textarea
    // had focus and neither viewport API reported anything. That
    // misfired in the HA Companion app and on iPads with external
    // keyboards: the bar floated 310 px above the visible bottom
    // because there *was* no keyboard occluding it. Dropped in 1.18.2
    // — if we genuinely cannot measure the keyboard we leave the bar
    // at the bottom edge of the visual viewport (worst case: the user
    // dismisses the keyboard via the device's own close affordance to
    // reveal the bar), which is strictly better than the previous
    // "float somewhere mid-screen" failure mode.
    function topWindow() {
      try {
        var w = window;
        while (w.parent && w.parent !== w) w = w.parent;
        // touch a property to confirm same-origin access
        void w.innerHeight;
        return w;
      } catch (_e) { return null; }
    }

    // Anything below this in either visualViewport delta is almost
    // certainly safe-area / toolbar chrome, not the on-screen keyboard.
    // 40 px clears the iPhone home-indicator inset (~34 px) with a
    // little margin and is still well below the smallest plausible
    // mobile keyboard (landscape iPhone, no predictions: ~135 px).
    // Lowered from 80 in 1.18.5 because the HA Companion app on iOS
    // was occasionally reporting smaller-than-expected gaps that
    // 80 px discarded — letting the keyboard cover the last terminal
    // line.
    var MIN_KB_GAP = 40;

    // Tracks whether the xterm helper-textarea currently has focus.
    // Used by the last-resort phone-only keyboard heuristic in
    // computeGap() below — see the comment there for the full
    // rationale.
    var taFocused = false;

    // Latches that flip true the first time each visualViewport
    // surface reports a real keyboard (gap >= MIN_KB_GAP). Used by
    // computeGap() to decide whether to *trust* a subsequent gap=0
    // report from that surface ("keyboard is down") or treat it as
    // "no signal yet, fall through to the heuristic". Once we've
    // proven a VV is responsive in this session, gap=0 from it means
    // the keyboard really did close — this is what closes the gap
    // where focusout doesn't fire when the user dismisses the iOS
    // keyboard via its own ▼ button.
    var topVVResponsive = false;
    var ownVVResponsive = false;

    // Stable innerHeight measured per orientation. Tracked separately so
    // flipping between portrait/landscape (very different natural heights)
    // doesn't false-trip the shrink-for-keyboard check below.
    //   - Used to detect WebViews that resize themselves for the
    //     keyboard (HA Companion on Android, occasionally on iOS).
    //     When that happens, the bar at bottom: 0 is already above the
    //     keys; translating would float it mid-screen.
    //   - Updated on every `resize`, but only ever *grows* — so a
    //     resize triggered by the keyboard opening (smaller height)
    //     is ignored as a baseline candidate, and a resize from the
    //     keyboard closing or a rotation back to a larger orientation
    //     pulls the baseline up to the new natural max.
    var stableHeights = { portrait: 0, landscape: 0 };
    function orientationKey() {
      return window.innerHeight >= window.innerWidth ? 'portrait' : 'landscape';
    }
    function captureBaseline() {
      var k = orientationKey();
      if (window.innerHeight > stableHeights[k]) {
        stableHeights[k] = window.innerHeight;
      }
    }
    captureBaseline();
    setTimeout(captureBaseline, 400);
    setTimeout(captureBaseline, 1500);
    window.addEventListener('resize', captureBaseline);

    function viewportShrunkForKeyboard() {
      // 60 px threshold so a status-bar reflow or device-rotation flicker
      // doesn't get mistaken for the keyboard.
      var stable = stableHeights[orientationKey()];
      return stable > 0 && window.innerHeight < stable - 60;
    }

    function computeGap() {
      // The WebView already shrank to make room for the keyboard:
      // bar at bottom:0 is correct, no translate.
      if (viewportShrunkForKeyboard()) return 0;

      var top = topWindow();
      if (top && top.visualViewport) {
        var pvv = top.visualViewport;
        var pgap = top.innerHeight - pvv.height - pvv.offsetTop;
        if (pgap >= MIN_KB_GAP) {
          // Latch — VV is provably responsive in this session, so a
          // future gap=0 report from it means the keyboard genuinely
          // closed (not "API is silent, guess").
          topVVResponsive = true;
          return Math.round(pgap);
        }
        // Trust gap=0 ONLY after VV has shown us a real keyboard at
        // least once. Otherwise some HA Companion builds whose parent
        // VV never updates would leave the bar buried under the keys.
        if (topVVResponsive) return 0;
      }
      if (window.visualViewport) {
        var vv = window.visualViewport;
        var ogap = window.innerHeight - vv.height - vv.offsetTop;
        if (ogap >= MIN_KB_GAP) {
          ownVVResponsive = true;
          return Math.round(ogap);
        }
        if (ownVVResponsive) return 0;
      }

      // Last-resort phone-only heuristic. When the textarea has focus
      // AND we're on a phone-sized viewport AND no VV surface has yet
      // proven itself responsive, we're almost certainly inside an HA
      // Companion app build whose keyboard avoidance doesn't update
      // the iframe's view of the visual viewport. Use a conservative
      // keyboard height that covers iPhone mini through Pro Max.
      //
      // Constrained to phone-sized viewports (`innerWidth < 500`
      // covers portrait phones up to Pro Max @ 430 px; `innerHeight
      // < 500` covers the same phones in landscape ≤ ~430 px high)
      // so iPads + external keyboards — where focusing doesn't open
      // a software keyboard — don't get the 1.18.2 floating-mid-
      // screen regression.
      //
      // 1.18.2 dropped this heuristic entirely and the iPhone HA
      // Companion app then left the bar buried under the keyboard;
      // 1.18.5 brought it back but bounded it, and now also defers
      // to a responsive VV's gap=0 (above) so the bar drops cleanly
      // when the user dismisses the iOS keyboard via its own ▼ button
      // (which doesn't fire focusout, so taFocused stays true).
      if (taFocused
          && (window.innerWidth < 500 || window.innerHeight < 500)) {
        var portrait = window.innerHeight >= window.innerWidth;
        return portrait ? 290 : 200;
      }

      return 0;
    }

    function syncBarToKeyboard() {
      var gap = computeGap();
      if (gap > 0) {
        // Keyboard is up: drop the safe-area inset (keyboard replaces
        // the home-indicator area) and stick the bar right above the keys.
        bar.style.transform = 'translateY(-' + gap + 'px)';
        bar.style.paddingBottom = '6px';
      } else {
        bar.style.transform = '';
        bar.style.paddingBottom = '';
      }
      syncHeight(gap);
    }
    syncBarToKeyboard();
    window.addEventListener('resize', syncBarToKeyboard);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncBarToKeyboard);
      window.visualViewport.addEventListener('scroll', syncBarToKeyboard);
    }
    var top = topWindow();
    if (top && top !== window && top.visualViewport) {
      top.visualViewport.addEventListener('resize', syncBarToKeyboard);
      top.visualViewport.addEventListener('scroll', syncBarToKeyboard);
    }
    // The xterm textarea gaining or losing focus is roughly when the
    // software keyboard opens / closes. We re-run syncBarToKeyboard on
    // a couple of delays so we sample the visualViewport AFTER iOS
    // finishes animating the keys in/out (the API is reactive on the
    // event itself, but the measurement isn't accurate until the
    // animation settles).
    document.addEventListener('focusin', function (e) {
      if (e.target && e.target.classList
          && e.target.classList.contains('xterm-helper-textarea')) {
        taFocused = true;
        setTimeout(syncBarToKeyboard, 100);
        setTimeout(syncBarToKeyboard, 350);
      }
    }, true);
    document.addEventListener('focusout', function (e) {
      if (e.target && e.target.classList
          && e.target.classList.contains('xterm-helper-textarea')) {
        taFocused = false;
        setTimeout(syncBarToKeyboard, 100);
      }
    }, true);

    function handleKey(keyName) {
      if (keyName === 'hide') {
        document.body.classList.add('bruh-bar-hidden');
        window.dispatchEvent(new Event('resize'));
        return;
      }
      if (keyName === 'kbdown') {
        // Dismiss the iOS / Android software keyboard by blurring
        // the xterm helper-textarea. The user can tap back into the
        // terminal to reopen it. We intentionally do NOT add a class
        // / set a flag — focus state is the single source of truth.
        var ta = document.querySelector('.xterm-helper-textarea');
        if (ta && ta.blur) ta.blur();
        return;
      }
      if (keyName === 'paste') {
        if (navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText()
            .then(function (t) { if (t) sendInput(t); })
            .catch(function () { /* permission denied — silent */ });
        }
        return;
      }
      var str = KEYS[keyName];
      if (str !== undefined) sendInput(str);
    }

    function onPointerDown(e) {
      // preventDefault on EVERY pointerdown inside the bar — not just
      // when we hit a key. Without this, tapping a gap between keys
      // (or the bar's own padding) lets iOS treat the tap as "touched
      // outside the focused field" and dismiss the keyboard. The
      // bar's horizontal scroll keeps working because preventDefault
      // on `pointerdown` doesn't suppress touch-scroll (that comes
      // from touchmove + touch-action).
      e.preventDefault();
      var el = e.target.closest && e.target.closest('.bruh-key');
      if (!el) return;
      el.classList.add('bruh-pressed');
      setTimeout(function () { el.classList.remove('bruh-pressed'); }, 120);
      var keyName = el.dataset.bruhKey;
      handleKey(keyName);
      // Restore focus to the xterm helper-textarea after every tap so
      // typing continues — *except* for the close-keyboard button,
      // which just called blur() and would otherwise be instantly
      // undone by this re-focus.
      if (keyName !== 'kbdown') {
        var ta = document.querySelector('.xterm-helper-textarea');
        if (ta) ta.focus();
      }
    }
    bar.addEventListener('pointerdown', onPointerDown);
    if (!window.PointerEvent) {
      bar.addEventListener('touchstart', onPointerDown, { passive: false });
      bar.addEventListener('mousedown', onPointerDown);
    }
  }

  // ===================================================================
  // 4. Touch scroll forwarder for the terminal scrollback.
  //
  // xterm.js renders into a structure like this:
  //
  //   .terminal                 (Terminal._element — wheel handler
  //                              attached HERE)
  //     .xterm-viewport         (overflow-y: auto — has its own
  //                              `scroll` listener that drives the
  //                              re-render)
  //     .xterm-screen           (position: relative — sits ON TOP of
  //       <canvas>              xterm-viewport in document order, so
  //       <canvas>              this is what the user actually touches)
  //     .xterm-helper-textarea
  //
  // Because xterm-viewport is a *sibling* of xterm-screen (not an
  // ancestor), iOS's "walk up the ancestor chain looking for a
  // scrollable container" search runs past xterm-viewport entirely
  // when the user drags the terminal. With body / html locked at
  // overflow: hidden the search finds no scrollable container inside
  // the iframe, so the gesture is delegated to the parent — the HA
  // frontend — which has its own scrollable root and scrolls the
  // BRUH Claude Terminal panel header off the top of the screen.
  //
  // body's `touch-action: none` (set in CSS above) blocks the native
  // delegation. We then forward each touchmove to a synthesised
  // `wheel` event dispatched on the `.terminal` element. xterm.js
  // attaches its scrollback wheel handler directly there (Viewport.ts
  // does `addDisposableDomListener(this._element, 'wheel', ...)`) so
  // this is the same code path that mouse wheel goes through and is
  // the most reliable way to drive xterm's scroll without depending
  // on private internals. We also push `xterm-viewport.scrollTop` as
  // a belt-and-suspenders for any renderer that drives the buffer off
  // the viewport's scroll event rather than wheel.
  //
  // 1.18.3 set scrollTop directly and *only* scrollTop; on ttyd's
  // bundled xterm that didn't produce any visible scroll (the user
  // reported "doesn't scroll at all"), which is the symptom that
  // motivated this 1.18.4 rewrite.
  // ===================================================================
  function setupScrollForwarder() {
    var startY = 0;
    var lastY = 0;
    var dragging = false;
    var moved = false;
    var wheelTarget = null;

    function findWheelTarget() {
      // xterm's wheel handler lives on .terminal (Terminal._element).
      // Cache the lookup but redo it if the cached element falls out
      // of the DOM (ttyd may rebuild the tree on reconnect).
      if (wheelTarget && wheelTarget.isConnected) return wheelTarget;
      wheelTarget = document.querySelector('.terminal')
                 || document.querySelector('.xterm');
      return wheelTarget;
    }
    function findViewport() {
      return document.querySelector('.xterm-viewport');
    }

    document.addEventListener('touchstart', function (e) {
      dragging = false;
      if (!e.touches || e.touches.length !== 1) return;
      var t = e.target;
      // Toolbar runs its own pan-x scroll; don't fight it.
      if (t && t.closest && t.closest('#bruh-bar')) return;
      startY = lastY = e.touches[0].clientY;
      dragging = true;
      moved = false;
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!dragging || !e.touches || e.touches.length !== 1) return;
      var currentY = e.touches[0].clientY;
      var totalDelta = currentY - startY;
      // Tap threshold — below 8 px of vertical travel we treat this
      // as still potentially a tap and let xterm see the events for
      // focus / selection.
      if (!moved && Math.abs(totalDelta) < 8) return;
      moved = true;

      // Incremental pixel delta since the last touchmove. Positive
      // when the finger moves UP (which means we want to scroll the
      // terminal DOWN — same sign convention as `WheelEvent.deltaY`).
      var increment = lastY - currentY;
      lastY = currentY;

      if (increment !== 0) {
        // Only drive xterm's scroll path when there's actually
        // scrollback to show. In Claude Code's TUI (xterm alternate-
        // screen mode) the viewport has no scrollable area, and
        // xterm's wheel handler in that mode translates wheel
        // events into ↑/↓ arrow key escape sequences fed straight to
        // the application — which is what produced the "every swipe
        // arrow-keys around in Claude Code" complaint after 1.18.4.
        //
        // `scrollHeight > clientHeight + 1` is a reliable proxy: in
        // altscreen the scroll-area height equals the visible
        // viewport, so the inequality is false and we skip the wheel
        // dispatch. In normal-screen with output, scrollback grows
        // scrollHeight past clientHeight and the user gets real
        // scrolling.
        var vp = findViewport();
        var hasScrollback = vp
            && (vp.scrollHeight - vp.clientHeight) > 1;
        if (hasScrollback) {
          var target = findWheelTarget();
          if (target) {
            try {
              target.dispatchEvent(new WheelEvent('wheel', {
                bubbles: true,
                cancelable: true,
                deltaX: 0,
                deltaY: increment,
                deltaMode: 0 /* DOM_DELTA_PIXEL */
              }));
            } catch (_err) { /* WheelEvent unsupported — fall through */ }
          }
          // Belt-and-suspenders: nudge scrollTop directly too so any
          // renderer that drives the buffer off the viewport's
          // `scroll` event also re-renders.
          var maxScroll = vp.scrollHeight - vp.clientHeight;
          var next = vp.scrollTop + increment;
          if (next < 0) next = 0;
          if (next > maxScroll) next = maxScroll;
          if (next !== vp.scrollTop) vp.scrollTop = next;
        }
        // Else: TUI mode (or no output yet). Don't synthesise wheel,
        // don't move scrollTop — just preventDefault below so the
        // gesture can't leak to the parent.
      }

      // Always preventDefault on a real drag, even if nothing
      // actually scrolled — otherwise iOS bubbles the gesture up to
      // the HA frontend and scrolls the panel header off the screen.
      e.preventDefault();
    }, { passive: false });

    function endDrag() { dragging = false; }
    document.addEventListener('touchend', endDrag, { passive: true });
    document.addEventListener('touchcancel', endDrag, { passive: true });
    return true;
  }

  // ===================================================================
  // 5. Bootstrap — wait for xterm to mount, then wire everything up.
  // ===================================================================
  var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints | 0) > 0;

  function onXtermReady(ta) {
    patchTextareaAttrs(ta);
    if (touch) {
      // Class lives on BOTH html and body: the html rule applies
      // overflow:hidden to the document element (so iOS can't auto-
      // scroll it to bring the focused textarea into view, which
      // would otherwise drag our `position: fixed` bar with it), the
      // body rule clamps the body's box to the viewport so xterm's
      // layout stays consistent under the keyboard.
      document.documentElement.classList.add('bruh-is-touch');
      document.body.classList.add('bruh-is-touch');
      // Listeners attach at the document level so they're safe to
      // register before xterm finishes mounting — the wheel-target
      // lookup runs on every touchmove and caches per-session.
      setupScrollForwarder();
    }
    buildToolbar();
  }

  function scanAndWire() {
    var ta = document.querySelector('.xterm-helper-textarea');
    if (ta) { onXtermReady(ta); return true; }
    return false;
  }

  function startObserver() {
    if (scanAndWire()) return;
    var obs = new MutationObserver(function () {
      if (scanAndWire()) obs.disconnect();
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    // Belt-and-suspenders: if the observer misses the insertion for any
    // reason, poll for up to 20s so slow devices still light up the UI.
    var tries = 0;
    var timer = setInterval(function () {
      if (scanAndWire() || ++tries > 80) {
        clearInterval(timer);
        obs.disconnect();
      }
    }, 250);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startObserver, { once: true });
  } else {
    startObserver();
  }
})();
</script>
