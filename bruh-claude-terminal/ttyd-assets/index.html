<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>BRUH Claude Terminal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      :root {
        --bg:          #1a1613;
        --bg-soft:     #241d18;
        --accent:      #d97757;
        --accent-dim:  #a85638;
        --fg:          #e8ddd4;
        --muted:       #a89b90;
        --border:      #3a2e25;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      #app {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      #terminal {
        flex: 1 1 auto;
        min-height: 0;
        background: var(--bg);
      }

      /* Mobile toolbar — shown only on touch devices */
      #mobile-bar {
        display: none;
        flex: 0 0 auto;
        background: var(--bg-soft);
        border-top: 1px solid var(--border);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        white-space: nowrap;
        scrollbar-width: none;
      }
      #mobile-bar::-webkit-scrollbar { display: none; }

      body.is-touch #mobile-bar { display: block; }
      body.bar-hidden #mobile-bar { display: none; }

      .mb-key {
        display: inline-block;
        min-width: 44px;
        height: 36px;
        line-height: 36px;
        padding: 0 10px;
        margin: 0 2px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: 'SF Mono', Menlo, Consolas, monospace;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        vertical-align: middle;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
        transition: background 0.08s, border-color 0.08s, color 0.08s;
      }

      .mb-key:active,
      .mb-key.pressed {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1613;
      }

      .mb-key.sticky-on {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1613;
      }

      .mb-key.primary {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
      }
      .mb-key.primary:active { background: var(--accent); }

      .mb-key.hide-btn {
        min-width: 36px;
        padding: 0 8px;
        color: var(--muted);
      }
    </style>
</head>
<body>
    <div id="app">
        <div id="terminal"></div>
        <div id="mobile-bar" role="toolbar" aria-label="Mobile terminal controls">
            <span class="mb-key primary" data-key="esc">ESC</span>
            <span class="mb-key" data-key="tab">Tab</span>
            <span class="mb-key" data-key="ctrl">Ctrl</span>
            <span class="mb-key" data-key="up">↑</span>
            <span class="mb-key" data-key="down">↓</span>
            <span class="mb-key" data-key="left">←</span>
            <span class="mb-key" data-key="right">→</span>
            <span class="mb-key" data-key="pipe">|</span>
            <span class="mb-key" data-key="slash">/</span>
            <span class="mb-key" data-key="tilde">~</span>
            <span class="mb-key" data-key="dash">-</span>
            <span class="mb-key" data-key="ctrlc">^C</span>
            <span class="mb-key" data-key="paste">Paste</span>
            <span class="mb-key hide-btn" data-key="hide" aria-label="Hide toolbar">×</span>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // -------------------------------------------------------------------
        // Capture ttyd's WebSocket so we can push raw input from the toolbar
        // -------------------------------------------------------------------
        // ttyd's protocol is: binary frame of TextEncoder.encode('0' + data)
        // for stdin input (Command.INPUT = '0').
        var ttydSocket = null;
        var OrigWS = window.WebSocket;
        var enc = new TextEncoder();

        function WrappedWS(url, protocols) {
            var ws = protocols === undefined
                ? new OrigWS(url)
                : new OrigWS(url, protocols);
            if (String(url).indexOf('/ws') !== -1) {
                ttydSocket = ws;
            }
            return ws;
        }
        WrappedWS.prototype = OrigWS.prototype;
        WrappedWS.CONNECTING = OrigWS.CONNECTING;
        WrappedWS.OPEN       = OrigWS.OPEN;
        WrappedWS.CLOSING    = OrigWS.CLOSING;
        WrappedWS.CLOSED     = OrigWS.CLOSED;
        window.WebSocket = WrappedWS;

        function sendInput(data) {
            if (!ttydSocket || ttydSocket.readyState !== 1) return;
            ttydSocket.send(enc.encode('0' + data));
        }

        // -------------------------------------------------------------------
        // Touch detection
        // -------------------------------------------------------------------
        var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (isTouch) document.body.classList.add('is-touch');

        // -------------------------------------------------------------------
        // Toolbar key handling
        // -------------------------------------------------------------------
        var ctrlSticky = false;
        var ctrlEl = null;

        var KEYS = {
            'esc':    '\x1b',
            'tab':    '\x09',
            'up':     '\x1b[A',
            'down':   '\x1b[B',
            'right':  '\x1b[C',
            'left':   '\x1b[D',
            'pipe':   '|',
            'slash':  '/',
            'tilde':  '~',
            'dash':   '-',
            'ctrlc':  '\x03'
        };

        function setCtrl(on) {
            ctrlSticky = on;
            if (ctrlEl) ctrlEl.classList.toggle('sticky-on', on);
        }

        function refocusTerminal() {
            var ta = document.querySelector('.xterm-helper-textarea');
            if (ta) ta.focus();
        }

        function handleKey(keyName) {
            if (keyName === 'ctrl') {
                setCtrl(!ctrlSticky);
                return;
            }
            if (keyName === 'hide') {
                document.body.classList.add('bar-hidden');
                // Trigger xterm resize via FitAddon (ttyd listens on resize)
                window.dispatchEvent(new Event('resize'));
                return;
            }
            if (keyName === 'paste') {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    navigator.clipboard.readText()
                        .then(function(text) { if (text) sendInput(text); })
                        .catch(function() { /* permission denied — silently ignore */ });
                }
                return;
            }
            var str = KEYS[keyName];
            if (str === undefined) return;

            // Sticky Ctrl: transform next single-char key into control code
            if (ctrlSticky && str.length === 1) {
                var code = str.toUpperCase().charCodeAt(0);
                if (code >= 64 && code <= 95) {
                    str = String.fromCharCode(code - 64);
                }
                setCtrl(false);
            }
            sendInput(str);
        }

        // pointerdown + preventDefault keeps xterm's textarea focused, which
        // matters on iOS: otherwise tapping the toolbar closes the keyboard.
        function onBarPointerDown(e) {
            var el = e.target.closest && e.target.closest('.mb-key');
            if (!el) return;
            e.preventDefault();
            el.classList.add('pressed');
            setTimeout(function() { el.classList.remove('pressed'); }, 120);
            handleKey(el.dataset.key);
            refocusTerminal();
        }

        var bar = document.getElementById('mobile-bar');
        bar.addEventListener('pointerdown', onBarPointerDown);
        // Safari < 13 fallback
        if (!window.PointerEvent) {
            bar.addEventListener('touchstart', onBarPointerDown, { passive: false });
            bar.addEventListener('mousedown', onBarPointerDown);
        }

        // -------------------------------------------------------------------
        // iOS dictation / autocorrect duplicate-text fix
        // -------------------------------------------------------------------
        // Root cause: iOS voice dictation and autocorrect fire a second
        // `input` event immediately after `compositionend` with the same
        // text xterm already consumed, producing doubled words. We disable
        // autocorrect on the xterm helper textarea and swallow any stray
        // `input` event that arrives within a short window of compositionend.
        function patchTextarea() {
            var ta = document.querySelector('.xterm-helper-textarea');
            if (!ta || ta.dataset.bruhPatched) return !!ta;
            ta.dataset.bruhPatched = '1';

            ta.setAttribute('autocorrect',   'off');
            ta.setAttribute('autocapitalize','off');
            ta.setAttribute('autocomplete',  'off');
            ta.setAttribute('spellcheck',    'false');
            ta.setAttribute('inputmode',     'text');

            var composing = false;
            var lastCompositionEnd = 0;

            ta.addEventListener('compositionstart', function() {
                composing = true;
            }, true);
            ta.addEventListener('compositionend', function() {
                composing = false;
                lastCompositionEnd = Date.now();
            }, true);
            ta.addEventListener('input', function(e) {
                if (!composing && (Date.now() - lastCompositionEnd) < 60) {
                    e.stopImmediatePropagation();
                    ta.value = '';
                }
            }, true);

            // Save the reference to the Ctrl button for toggling
            ctrlEl = document.querySelector('[data-key="ctrl"]');
            return true;
        }

        var tries = 0;
        var timer = setInterval(function() {
            if (patchTextarea() || ++tries > 40) clearInterval(timer);
        }, 250);

        // Make sure the Ctrl ref is wired even if the terminal is late
        ctrlEl = document.querySelector('[data-key="ctrl"]');
    })();
    </script>
    <script src="inline.js"></script>
</body>
</html>
