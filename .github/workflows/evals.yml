# The house's LLM jobs, graded against their eval cases (plan item 1.6).
#
# tests/evals/run.py builds each case's REAL prompt with the job's own
# builder, asks the job's pinned model three times, and grades every answer
# with a deterministic grader. A regression suite under 95% pass^3 fails
# this job. docs/notes/diagnostics.md has the rules.
#
# Three things about how it is wired:
#
# **It runs on a pull request that can move a prompt, and nightly.** The
# `paths:` below are tests/evals/select.py's `workflow_paths()`, and
# tests/evals/test_graders.py holds the two equal, so a builder added to
# select.py without its path here (or the reverse) fails the ordinary suite.
#
# **No secret is a pass with a notice, never a failure.** A fork's pull
# request has no secrets, and a gate that goes red for want of a credential
# is a gate people learn to ignore. The free half still runs: every case's
# prompt is built with today's builders (`--dry-run`), which is what catches
# a builder that moved. Making this check required is a ruleset on `main`,
# which is the owner's one-time setup, not something a workflow can do.
#
# **Everything that moves the number is pinned here or in the code**: the
# Claude Code CLI version below, the agent model per job
# (tests/evals/model.py PINNED_MODELS) and the judge model
# (tests/evals/graders/judge.py JUDGE_MODEL). The report records all of
# them, and the runner's environment, as an artifact.
name: Evals

on:
  pull_request:
    branches: [main]
    paths:
      - brain/scripts/brain-memory-extract.py
      - brain/scripts/brain-memory-consolidate.sh
      - brain/panel/outcomes.py
      - brain/panel/resident.py
      - brain/panel/signals.py
      - brain/panel/prompt_kit.py
      - brain/morph/service/learning.py
      - brain/panel/devloop/streams.py
      - tests/corpus/entries/*.json
      - tests/evals/cases/extractor/**
      - tests/evals/cases/consolidator/**
      - tests/evals/cases/reflect/**
      - tests/evals/cases/first_look/**
      - tests/evals/cases/morph_learning/**
      - tests/evals/cases/devloop_streams/**
      - tests/evals/*.py
      - tests/evals/graders/*.py
      - .github/workflows/evals.yml
  schedule:
    # 03:40 UTC, off the hour and away from the corpus replay's 04:20.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated jobs (empty = every job)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CLI the prompts are graded through. Pinned, because a CLI release
  # can change how a schema or a system prompt reaches the model.
  CLAUDE_CODE_VERSION: "2.1.318"
  # The spend cap for one run, across every trial and every judge call.
  # The runner stops asking once it is reached and says so in the report.
  EVALS_MAX_TOKENS: "2500000"

jobs:
  evals:
    name: Grade the house's LLM jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      - name: Build every case's prompt (no model)
        run: python tests/evals/run.py --dry-run

      - name: Is there a credential to spend?
        id: creds
        env:
          TOKEN: ${{ secrets.BRAIN_REPLAY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Evals skipped::No BRAIN_REPLAY_TOKEN is set, so no model was asked. Every case's prompt was built above; set the secret to a Claude OAuth token to grade them."
          fi

      - name: Install Claude Code
        if: steps.creds.outputs.have == 'yes'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Fetch the base branch
        if: steps.creds.outputs.have == 'yes' && github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Run the evals
        if: steps.creds.outputs.have == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.BRAIN_REPLAY_TOKEN }}
          JOBS: ${{ inputs.jobs }}
        run: |
          args=(--max-tokens "$EVALS_MAX_TOKENS" --workers 4 --out evals-report.json)
          if [ -n "${JOBS:-}" ]; then
            args+=(--jobs "$JOBS")
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only the jobs this pull request can move.
            args+=(--changed "origin/${{ github.base_ref }}")
          fi
          python tests/evals/run.py "${args[@]}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-report
          path: evals-report.json
          if-no-files-found: ignore
