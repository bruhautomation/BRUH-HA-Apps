name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here checks out the repo and runs a linter or the test suite.
# None of them calls the API, pushes, comments, or uploads an artifact — so
# none of them needs a token that could. Without this block the jobs inherit
# whatever the repository default is, which for an older repo is read/write
# on every scope, and the blast radius of a compromised third-party action
# is that default rather than what the job actually does.
#
# build.yml, codeql.yml and label-by-addon.yml already declare theirs and
# widen it per job where it is genuinely needed (`packages: write` for the
# registry push, `security-events: write` for the SARIF upload). Nothing
# here needs widening.
permissions:
  contents: read

# A push to a pull request's branch makes every run before it a run about
# code nobody is going to merge, so the newer one cancels it. Runs on main
# are different: each one is the record of a commit that landed, and a run
# cancelled there is a commit nobody ever checked. So main's group is keyed
# on the commit — every push is its own group and nothing replaces it —
# while a pull request's is keyed on its ref. Keying main on the branch and
# only switching cancel-in-progress off is not enough: GitHub still
# cancels a PENDING run in the same group when a newer one arrives, so the
# middle of three quick merges would never run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # One decision about what a pull request can have affected, made once
    # and printed once, read by the tests job and the layout groups. It
    # only ever NARROWS: every way of not knowing (a push, a failed fetch,
    # an empty diff, a change to the machinery the tests share) answers
    # "run everything", because a test skipped on a guess is a regression
    # that reaches main. No third-party paths-filter action — a `git diff`
    # answers the question and adding a dependency is a person's decision.
    name: Decide what this change can affect
    runs-on: ubuntu-latest
    outputs:
      pytest_args: ${{ steps.scope.outputs.pytest_args }}
      bright: ${{ steps.scope.outputs.bright }}
      print: ${{ steps.scope.outputs.print }}
    steps:
      - uses: actions/checkout@v7

      # On a pull_request the checkout is the merge commit, i.e. the base
      # branch with the PR applied, so a two-dot diff against the base's
      # tip is exactly what merging would change. That needs one commit of
      # the base and no history, hence a depth-1 fetch rather than
      # fetch-depth: 0. If the base moves between the merge commit being
      # made and this fetch, its new files show up as "changed" too — which
      # can only make the run wider, never narrower.
      - name: Work out which tests and layout groups apply
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          out="${GITHUB_OUTPUT:-/dev/stdout}"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"

          everything() {
            echo "Decision: every test file and every layout group runs — $1"
            {
              echo "pytest_args="
              echo "bright=true"
              echo "print=true"
            } >> "$out"
            echo "Everything runs: $1" >> "$summary"
            exit 0
          }

          if [ "$EVENT" != "pull_request" ]; then
            everything "a $EVENT run checks the whole repository; only a pull request is narrowed"
          fi
          if ! git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            everything "could not fetch origin/$BASE_REF to compare against"
          fi
          if ! changed=$(git diff --name-only "origin/$BASE_REF" HEAD); then
            everything "could not diff against origin/$BASE_REF"
          fi
          if [ -z "$changed" ]; then
            everything "the diff against origin/$BASE_REF is empty, which is nothing to narrow on"
          fi

          echo "Changed against origin/$BASE_REF:"
          sed 's/^/  /' <<<"$changed"

          # What every test file leans on, whichever add-on it is about:
          # the shared fixtures and fakes, the pytest config, the test
          # dependencies, and this workflow (which decides the selection,
          # so a change to it is tested by the run it would narrow).
          shared=$(grep -E '^(pytest\.ini|pyproject\.toml|setup\.cfg|tox\.ini|conftest\.py|tests/conftest\.py|tests/fake_[^/]*\.py|tests/[^/]*_env\.py|tests/requirements-dev\.txt|\.github/workflows/ci\.yml)$' <<<"$changed" || true)
          if [ -n "$shared" ]; then
            everything "shared test infrastructure changed: $(tr '\n' ' ' <<<"$shared")"
          fi

          # Prefixed files that read MORE than their own add-on, so they
          # can never be skipped on that add-on being untouched:
          # test_bright_addon reads BRUH Minecraft's config.yaml (the two
          # ingress ports must not collide) and test_bruh_print_addon reads
          # .github/workflows/build.yml. Every other test_bright_*,
          # test_bruh_print_* and test_minecraft_* file reads only its own
          # add-on's directory (checked by grep when this was written —
          # test_bright_director_check's "brain" is a temp directory name,
          # not brAIn's code). Anything without one of these three prefixes
          # — brAIn's tests and every cross-add-on test (hardening, brand
          # assets, documented counts, labelling) — always runs.
          always=" tests/test_bright_addon.py tests/test_bruh_print_addon.py "
          args=""

          # Skip an add-on's own test files only when neither its directory
          # nor any of those test files changed. (Its test helpers are
          # either prefixed the same way or covered by the shared list.)
          narrow() {
            local name=$1 dir=$2 prefix=$3 f n=0
            if grep -qE "^(${dir}/|tests/${prefix}[^/]*\.py\$)" <<<"$changed"; then
              echo "$name: changed — its tests run"
              return
            fi
            for f in tests/"$prefix"*.py; do
              [ -e "$f" ] || continue
              case "$always" in *" $f "*) continue ;; esac
              args="$args --ignore=$f"
              n=$((n + 1))
            done
            echo "$name: untouched — skipping its $n own test files"
            echo "$name: untouched, $n test files skipped" >> "$summary"
          }
          narrow "BRight" bright test_bright_
          narrow "BRUH Print" bruh-print test_bruh_print_
          narrow "BRUH Minecraft" bruh-minecraft-server test_minecraft_

          # The two layout groups that boot an add-on's panel run when that
          # add-on or one of the files only that group reads changed. The
          # static groups are brAIn's panel and always run.
          bright=false
          if grep -qE '^(bright/|tests/manual/(bright_demo_panel\.py|measure-(effects|showeditor|manual|lightmap|library)\.mjs))' <<<"$changed"; then
            bright=true
          fi
          print=false
          if grep -qE '^(bruh-print/|tests/manual/(bruh_print_demo_panel\.py|measure-print-(panel|card)\.mjs))' <<<"$changed"; then
            print=true
          fi
          echo "Layout groups: static-a and static-b run; bright=$bright print=$print"
          echo "Layout: bright=$bright print=$print" >> "$summary"

          {
            echo "pytest_args=${args# }"
            echo "bright=$bright"
            echo "print=$print"
          } >> "$out"

  tests:
    name: Python tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      # -n 4 is the runner's core count (ubuntu-latest has four): the suite
      # took 6m11s serially and 1m41s this way. --dist loadfile keeps every
      # test in a file on one worker, because several files share module
      # state through sys.modules — they pop and re-import panel modules,
      # and BRight's and BRUH Print's panels both have a top-level `stores`
      # — and splitting a file across workers would make those tests pass
      # or fail on which worker drew them. The per-test timeout comes from
      # pytest.ini, so a hung test fails by name instead of eating the job.
      # PYTEST_ARGS is the changes job's --ignore list, empty when
      # everything runs; it is left unquoted on purpose so each --ignore
      # is its own word (the paths it holds contain no spaces).
      - name: Run pytest
        env:
          PYTEST_ARGS: ${{ needs.changes.outputs.pytest_args }}
        run: |
          echo "python -m pytest tests -q -n 4 --dist loadfile $PYTEST_ARGS"
          # shellcheck disable=SC2086
          python -m pytest tests -q -n 4 --dist loadfile $PYTEST_ARGS

  ruff:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Shell, YAML and Dockerfiles were all linted; the ~15k lines of
      # Python that actually serve the panels were not.
      - name: Run ruff
        run: ruff check .

  layout:
    # The four Playwright measures used to be tests/manual/ only — every
    # layout invariant CLAUDE.md calls load-bearing (two bar shapes and no
    # third, no target under 44px, the title never truncated, the chat meta
    # line actually painted, tooltips inside the viewport) was enforced by
    # a documented human habit. They run headless against static fixtures,
    # so the only thing keeping them out of CI was nobody promoting them.
    #
    # Thirty-five of them in one job took 4m40s, one after another, while
    # every other job finished in under a minute. They are independent —
    # each opens its own page — so they run as four groups on four runners:
    # brAIn's static-fixture measures split in two by their measured times
    # (about 65s and 68s), BRight's (its two static ones plus the three on
    # one booted demo panel) and BRUH Print's (its booted panel plus the
    # Lovelace card). Each group installs Playwright itself; 21s per runner
    # is cheaper than the serial chain it replaces.
    #
    # Every group is a job that always REPORTS, even when the changes job
    # said a pull request cannot have affected it — its steps are gated
    # rather than the job, so a branch protection rule naming one of these
    # checks never waits on a check that was never created. (A job-level
    # `if` cannot read `matrix` anyway; it is evaluated before the matrix
    # expands.) GROUP_RUNS falls through to 'true' whenever the changes
    # job's answer is missing, so a group is only ever skipped on a
    # positive "untouched", never on a missing one.
    name: Layout measures (${{ matrix.group }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      # One group failing must not cancel the others: a layout regression
      # in one panel says nothing about the rest, and a run that stopped at
      # the first red group hides the second until the next push.
      fail-fast: false
      matrix:
        group: [static-a, static-b, bright, print]
    env:
      GROUP_RUNS: ${{ (matrix.group == 'bright' && needs.changes.outputs.bright) || (matrix.group == 'print' && needs.changes.outputs.print) || 'true' }}
    steps:
      - name: Say why this group has nothing to do
        if: env.GROUP_RUNS != 'true'
        run: |
          echo "Skipped: this pull request changes nothing the ${{ matrix.group }} measures read (see the changes job's log)."

      - uses: actions/checkout@v7
        if: env.GROUP_RUNS == 'true'

      # ubuntu-latest ships a current Node; the scripts resolve Playwright
      # from the repo-root node_modules exactly as the README describes.
      - name: Install Playwright
        if: env.GROUP_RUNS == 'true'
        run: |
          # Pinned: an unpinned install takes whatever npm published a minute ago, and a tarball the registry cannot serve yet fails this job before a single measure runs.
          npm install playwright@1.62.1 --no-fund --no-audit
          npx playwright install --with-deps chromium

      # static-a: brAIn's static-fixture measures, first half (~65s).

      - name: Measure the top bar
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-topbar.mjs

      - name: Measure the card head
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-cardhead.mjs

      - name: Measure the chat meta line
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-chatmeta.mjs

      - name: Measure the terminal on a phone
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-terminal-mobile.mjs

      - name: Measure the tooltips
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-tooltips.mjs

      - name: Measure the activity tab
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-activity.mjs

      # Seven measurement rows, five states, four sections and the Today
      # strip. The failure it exists to catch is the tab's own reason for
      # existing: a store that has stopped, one that has not started and a
      # house with nothing to say are three silences that look identical
      # unless every row carries its state and its reason.
      - name: Measure the Knowledge tab
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-knowledge.mjs

      # The one screen somebody sees exactly once, which is why it goes
      # wrong quietly: nobody who has been through it will ever see the
      # version that is broken. Four steps, both empty cases, and — the one
      # that matters — that a step already answered is not asked again.
      - name: Measure the first-run flow
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-onboarding.mjs

      - name: Measure the suggestions on Today
        if: matrix.group == 'static-a'
        run: node tests/manual/measure-proposals.mjs

      # static-b: brAIn's static-fixture measures, second half (~68s).

      - name: Measure the Claude account surfaces
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-account.mjs

      - name: Measure the Problems section
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-problems.mjs

      # ⚙ is six disclosures rather than one scroll, and the numbers that
      # make that true — its open height, its lazy Advanced loaders, the
      # prose it moved onto a ? — are only checkable by driving it.
      - name: Measure the Settings dialog
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-settings.mjs

      # The development loop's section is hidden while the loop is off, which
      # is the only state measure-settings sees; this drives it switched on.
      - name: Measure the development loop's controls
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-devloop.mjs

      # What the panel spends on chrome before content: the sub-tab strip,
      # the status strip and Help's contents on a phone, and how much of a
      # wide screen the Home group's lists use.
      - name: Measure the panel's chrome
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-chrome.mjs

      # The chat's approval card is where the asking happens, so it is
      # where the way out of asking has to be: "Always allow" with what it
      # adds said in words, and "Stop asking…" landing on the switch in ⚙.
      - name: Measure the chat approval card
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-permcard.mjs

      # A live card has two ages; the foot used to report one of them.
      - name: Measure a live card's two ages
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-cardlive.mjs

      # A chore you cannot finish from the screen it is on is
      # indistinguishable from one nobody has got round to.
      - name: Measure Your list
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-todo.mjs

      # An idea is a proposal to spend a run every refresh interval for
      # ever, so what the card says before you save it IS the feature: the
      # evidence from this house, and the question it would answer. The
      # Suggested row under Reports is its name and Run when empty, and
      # only a failed look says anything.
      - name: Measure the Suggested ideas row
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-ideas.mjs

      - name: Measure the resolutions card
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-chatres.mjs

      # Ask: your chats only (no run-type chips), one ⋯ per row, the list
      # first on a phone with a way back, a reply's working folded into one
      # line while the cards that ask something stay out of it, and no
      # "Resume" anywhere.
      - name: Measure the Ask tab
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-ask.mjs

      # The tidy and update cards on Today, and the house book: a book
      # sentence with no source reads like a cited one, a tidy row with no
      # tick or a room move that does not name the automation it changes is
      # a review nobody can do, and an upgrade verdict without both quotes
      # is an opinion.
      - name: Measure the tidy, updates and house book
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-upkeep.mjs

      # House: four segments on one control (a select on a phone), the
      # Reports cards cut to a headline and an age, the house book a pane
      # of its own, and the top line of What happened is the house now.
      - name: Measure the House screen
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-house.mjs

      # A card nothing checked must not read like one something did.
      - name: Measure what a card says about being looked at
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-triage.mjs

      # Every kind of card on Today offers its own row and sends its own
      # route: a case whose ending is missing is work with nowhere to go.
      - name: Measure the cards' presses
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-home.mjs

      # What a fix would change, read before it changes it — and what it
      # did change, read before the undo beside it is pressed.
      - name: Measure the fix plan card
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-fixplan.mjs

      # Today, the one screen for deciding: no sub-tab bar, the first card
      # near the top, what fits and "Show N more", one card standard, the
      # status line, Your list, History and the first-run setup card.
      - name: Measure Today
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-today.mjs

      # The visual standard: four type sizes, sentence case, no browser
      # chrome on a select or a checkbox, and every card on the 4px grid
      # with one edge all the way round — read off every pane and ⚙.
      - name: Measure the visual tokens
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-tokens.mjs

      # The phone: a 56px header, the three tabs on a bar fixed to the
      # bottom, no sideways scroll at 390 or 320, and the sweep (no glyph
      # labels, no ? bubbles) on every pane and in ⚙.
      - name: Measure the phone layout
        if: matrix.group == 'static-b'
        run: node tests/manual/measure-phone.mjs

      # bright: BRight's panel — two static measures, then three on one
      # booted demo panel, in the order the comments below rely on.

      - name: Measure BRight's light map
        if: matrix.group == 'bright' && env.GROUP_RUNS == 'true'
        run: node tests/manual/measure-lightmap.mjs

      - name: Measure BRight's library tab
        if: matrix.group == 'bright' && env.GROUP_RUNS == 'true'
        run: node tests/manual/measure-library.mjs

      # This one needs the real panel behind it: the effect preview is a
      # canvas and a floor of dots, and "the timeline painted" is not
      # something a static fixture can answer. The panel boots against a
      # seeded scratch house — no bulbs are contacted and no Home
      # Assistant is needed.
      - name: Measure BRight's effect builder
        if: matrix.group == 'bright' && env.GROUP_RUNS == 'true'
        run: |
          pip install --quiet aiohttp numpy
          python3 tests/manual/bright_demo_panel.py /tmp/bright-demo &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8095/api/health && break
            sleep 0.5
          done
          node tests/manual/measure-effects.mjs

      # The show editor, on the panel the step above already started. It
      # also measures the waveform, whose envelope the demo SEEDS rather
      # than decodes — there is no ffmpeg in this job and the demo's
      # "track" is a few bytes on disk, so a decode could never run here.
      # edits as it goes — adding an effect, applying a no-op — but never
      # presses Save, so the seeded show on disk is the same one each width
      # opens. That independence is what lets it run three viewports in a
      # row and lets this step follow the effects one on a shared panel.
      - name: Measure BRight's show editor
        if: matrix.group == 'bright' && env.GROUP_RUNS == 'true'
        run: node tests/manual/measure-showeditor.mjs

      # The Manual tab, on the same booted panel: a performance surface
      # used one-handed in a dark room, so the measures are about the
      # hand — pad sizes, the tap pad counting, and a gesture before a
      # session exists coming back with its reason.
      - name: Measure BRight's Manual tab
        if: matrix.group == 'bright' && env.GROUP_RUNS == 'true'
        run: node tests/manual/measure-manual.mjs

      # print: BRUH Print's booted panel and its Lovelace card.

      # BRUH Print's panel, on its own booted instance. Every failure this
      # catches is a layout one that geometry can see and reading cannot:
      # a bar wider than the window, a <select> sized to its widest option,
      # a touch target under 44px, an empty toast that `[hidden]` did not
      # hide, a design canvas that does not fit its pane. The only thing
      # stood in for is the USB write.
      - name: Measure BRUH Print's panel
        if: matrix.group == 'print' && env.GROUP_RUNS == 'true'
        run: |
          pip install --quiet aiohttp pillow qrcode
          python3 tests/manual/bruh_print_demo_panel.py /tmp/bruh-print-demo &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8097/api/health && break
            sleep 0.5
          done
          node tests/manual/measure-print-panel.mjs

      # BRUH Print's Lovelace card, which needs no panel at all: it reads
      # the integration's sensors and calls its services, so a stubbed
      # `hass` is the whole world it lives in. It is here because nothing
      # in the repository had ever EXECUTED the card — every test of it
      # read the file, and a grep for a line is not a test of what the
      # line does.
      - name: Measure BRUH Print's Lovelace card
        if: matrix.group == 'print' && env.GROUP_RUNS == 'true'
        run: node tests/manual/measure-print-card.mjs

  hassfest:
    name: HA integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # hassfest is what Home Assistant runs against its own integrations:
      # it validates manifest.json, services.yaml, and that every service
      # and entity string has a translation. Both custom integrations are
      # deployed by their add-on rather than through HACS, which means
      # nothing else was ever checking them.
      #
      # The integrations live under each add-on rather than in a top-level
      # custom_components/. hassfest finds them either way — it walks the
      # tree and dedupes by domain — but staging them makes the layout it
      # reports match the one the action documents, and costs a copy.
      - name: Stage integrations for hassfest
        run: |
          mkdir -p custom_components
          cp -r brain/custom_components/brain custom_components/brain
          cp -r bruh-minecraft-server/custom_components/bruh_minecraft \
                custom_components/bruh_minecraft
          cp -r bright/custom_components/bright custom_components/bright

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master @ 2026-08-03

  apparmor:
    name: AppArmor profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install apparmor_parser
        run: |
          sudo apt-get update -q
          sudo apt-get install -y apparmor

      # A profile that doesn't parse doesn't fail at review time — it fails
      # on a user's machine, as an add-on that won't start. -Q parses and
      # validates without loading anything into the kernel.
      - name: Validate profiles
        run: |
          status=0
          for profile in brain/apparmor.txt bruh-minecraft-server/apparmor.txt bright/apparmor.txt; do
            if sudo apparmor_parser -Q -K "$profile"; then
              echo "✓ $profile"
            else
              echo "::error file=$profile::AppArmor profile does not parse"
              status=1
            fi
          done
          exit $status

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint add-on YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, trailing-spaces: enable, empty-lines: {max: 2}}}' \
            repository.yaml \
            bruh-minecraft-server/config.yaml \
            bruh-minecraft-server/build.yaml \
            brain/config.yaml \
            brain/build.yaml \
            brain/translations/en.yaml \
            bruh-minecraft-server/translations/en.yaml \
            bright/config.yaml \
            bright/build.yaml \
            bright/translations/en.yaml

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck (minecraft)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master @ 2026-08-03
        env:
          SHELLCHECK_OPTS: -s bash -e SC1091
        with:
          scandir: ./bruh-minecraft-server
          severity: error
          ignore_paths: >-
            bruh-minecraft-server/custom_components
            bruh-minecraft-server/panel

      - name: Run shellcheck (bright)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master @ 2026-08-03
        env:
          SHELLCHECK_OPTS: -s bash -e SC1091
        with:
          scandir: ./bright
          severity: error
          ignore_paths: >-
            bright/custom_components
            bright/panel
            bright/integrations

      - name: Run shellcheck (brain)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master @ 2026-08-03
        env:
          # bashio's `#!/usr/bin/with-contenv bashio` shebang is not one
          # shellcheck recognises — tell it to treat those scripts as bash.
          # SC1091: can't follow source (runtime paths).
          SHELLCHECK_OPTS: -s bash -e SC1091
        with:
          scandir: ./brain
          severity: error
          ignore_paths: >-
            brain/ha-mcp-server
            brain/custom_components
            brain/panel

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Lint Minecraft Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: bruh-minecraft-server/Dockerfile
          failure-threshold: error


      - name: Lint brAIn Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: brain/Dockerfile
          failure-threshold: error


      - name: Lint BRight Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: bright/Dockerfile
          failure-threshold: error

  manifest-versions:
    name: Manifest version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Check brAIn version parity
        run: |
          addon_version=$(grep -E '^version:' brain/config.yaml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          manifest_version=$(python3 -c 'import json; print(json.load(open("brain/custom_components/brain/manifest.json"))["version"])')
          echo "add-on:         $addon_version"
          echo "HA integration: $manifest_version"
          if [ "$addon_version" != "$manifest_version" ]; then
            echo "::error::brAIn add-on ($addon_version) and integration manifest ($manifest_version) versions disagree"
            exit 1
          fi

      - name: Check Minecraft version parity
        run: |
          addon_version=$(grep -E '^version:' bruh-minecraft-server/config.yaml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          manifest_version=$(python3 -c 'import json; print(json.load(open("bruh-minecraft-server/custom_components/bruh_minecraft/manifest.json"))["version"])')
          echo "add-on:         $addon_version"
          echo "HA integration: $manifest_version"
          if [ "$addon_version" != "$manifest_version" ]; then
            echo "::error::Minecraft add-on ($addon_version) and integration manifest ($manifest_version) versions disagree"
            exit 1
          fi

      # HA's store offers whatever config.yaml says — a changelog entry
      # announcing a version config.yaml doesn't carry means users read
      # about a release the store never offers them.

      - name: Check Minecraft changelog matches shipped version
        run: .github/scripts/check-changelog-version.sh bruh-minecraft-server

      # BRUH Insights has no companion HA integration, so no manifest
      # parity check — just the changelog/version consistency.

      - name: Check brAIn changelog matches shipped version
        run: .github/scripts/check-changelog-version.sh brain

      - name: Check BRight version parity
        run: |
          addon_version=$(grep -E '^version:' bright/config.yaml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          manifest_version=$(python3 -c 'import json; print(json.load(open("bright/custom_components/bright/manifest.json"))["version"])')
          echo "add-on:         $addon_version"
          echo "HA integration: $manifest_version"
          if [ "$addon_version" != "$manifest_version" ]; then
            echo "::error::BRight add-on ($addon_version) and integration manifest ($manifest_version) versions disagree"
            exit 1
          fi

      - name: Check BRight changelog matches shipped version
        run: .github/scripts/check-changelog-version.sh bright

  version-bump:
    # On every PR that touches addon files, verify the version in
    # config.yaml has bumped vs. the base branch. HA only picks up new
    # add-on images when the version changes — shipping a fix without a
    # bump means users don't get it. Pre-2.0.1 we had no enforcement,
    # which is exactly how 2.0.0's broken chat UI hit production.
    name: Version bump on addon changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need git history to diff HEAD against the PR base.
          fetch-depth: 0


      - name: Verify Minecraft Server version bumped if files changed
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}" bruh-minecraft-server


      - name: Verify brAIn version bumped if files changed
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}" brain

      - name: Verify BRight version bumped if files changed
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}" bright
