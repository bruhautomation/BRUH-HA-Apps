name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here checks out the repo and runs a linter or the test suite.
# None of them calls the API, pushes, comments, or uploads an artifact — so
# none of them needs a token that could. Without this block the jobs inherit
# whatever the repository default is, which for an older repo is read/write
# on every scope, and the blast radius of a compromised third-party action
# is that default rather than what the job actually does.
#
# build.yml, codeql.yml and label-by-addon.yml already declare theirs and
# widen it per job where it is genuinely needed (`packages: write` for the
# registry push, `security-events: write` for the SARIF upload). Nothing
# here needs widening.
permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -q

  ruff:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Shell, YAML and Dockerfiles were all linted; the ~15k lines of
      # Python that actually serve the panels were not.
      - name: Run ruff
        run: ruff check .

  hassfest:
    name: HA integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # hassfest is what Home Assistant runs against its own integrations:
      # it validates manifest.json, services.yaml, and that every service
      # and entity string has a translation. Both custom integrations are
      # deployed by their add-on rather than through HACS, which means
      # nothing else was ever checking them.
      #
      # The integrations live under each add-on rather than in a top-level
      # custom_components/. hassfest finds them either way — it walks the
      # tree and dedupes by domain — but staging them makes the layout it
      # reports match the one the action documents, and costs a copy.
      - name: Stage integrations for hassfest
        run: |
          mkdir -p custom_components
          cp -r brain/custom_components/brain custom_components/brain
          cp -r bruh-minecraft-server/custom_components/bruh_minecraft \
                custom_components/bruh_minecraft

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  apparmor:
    name: AppArmor profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install apparmor_parser
        run: |
          sudo apt-get update -q
          sudo apt-get install -y apparmor

      # A profile that doesn't parse doesn't fail at review time — it fails
      # on a user's machine, as an add-on that won't start. -Q parses and
      # validates without loading anything into the kernel.
      - name: Validate profiles
        run: |
          status=0
          for profile in brain/apparmor.txt bruh-minecraft-server/apparmor.txt; do
            if sudo apparmor_parser -Q -K "$profile"; then
              echo "✓ $profile"
            else
              echo "::error file=$profile::AppArmor profile does not parse"
              status=1
            fi
          done
          exit $status

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint add-on YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, trailing-spaces: enable, empty-lines: {max: 2}}}' \
            repository.yaml \
            bruh-minecraft-server/config.yaml \
            bruh-minecraft-server/build.yaml \
            brain/config.yaml \
            brain/build.yaml \
            brain/translations/en.yaml \
            bruh-minecraft-server/translations/en.yaml

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck (minecraft)
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash -e SC1091
        with:
          scandir: ./bruh-minecraft-server
          severity: error
          ignore_paths: >-
            bruh-minecraft-server/custom_components
            bruh-minecraft-server/panel

      - name: Run shellcheck (brain)
        uses: ludeeus/action-shellcheck@master
        env:
          # bashio's `#!/usr/bin/with-contenv bashio` shebang is not one
          # shellcheck recognises — tell it to treat those scripts as bash.
          # SC1091: can't follow source (runtime paths).
          SHELLCHECK_OPTS: -s bash -e SC1091
        with:
          scandir: ./brain
          severity: error
          ignore_paths: >-
            brain/ha-mcp-server
            brain/custom_components
            brain/panel

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Lint Minecraft Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: bruh-minecraft-server/Dockerfile
          failure-threshold: error


      - name: Lint brAIn Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: brain/Dockerfile
          failure-threshold: error

  manifest-versions:
    name: Manifest version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Check brAIn version parity
        run: |
          addon_version=$(grep -E '^version:' brain/config.yaml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          manifest_version=$(python3 -c 'import json; print(json.load(open("brain/custom_components/brain/manifest.json"))["version"])')
          echo "add-on:         $addon_version"
          echo "HA integration: $manifest_version"
          if [ "$addon_version" != "$manifest_version" ]; then
            echo "::error::brAIn add-on ($addon_version) and integration manifest ($manifest_version) versions disagree"
            exit 1
          fi

      - name: Check Minecraft version parity
        run: |
          addon_version=$(grep -E '^version:' bruh-minecraft-server/config.yaml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          manifest_version=$(python3 -c 'import json; print(json.load(open("bruh-minecraft-server/custom_components/bruh_minecraft/manifest.json"))["version"])')
          echo "add-on:         $addon_version"
          echo "HA integration: $manifest_version"
          if [ "$addon_version" != "$manifest_version" ]; then
            echo "::error::Minecraft add-on ($addon_version) and integration manifest ($manifest_version) versions disagree"
            exit 1
          fi

      # HA's store offers whatever config.yaml says — a changelog entry
      # announcing a version config.yaml doesn't carry means users read
      # about a release the store never offers them.

      - name: Check Minecraft changelog matches shipped version
        run: .github/scripts/check-changelog-version.sh bruh-minecraft-server

      # BRUH Insights has no companion HA integration, so no manifest
      # parity check — just the changelog/version consistency.

      - name: Check brAIn changelog matches shipped version
        run: .github/scripts/check-changelog-version.sh brain

  version-bump:
    # On every PR that touches addon files, verify the version in
    # config.yaml has bumped vs. the base branch. HA only picks up new
    # add-on images when the version changes — shipping a fix without a
    # bump means users don't get it. Pre-2.0.1 we had no enforcement,
    # which is exactly how 2.0.0's broken chat UI hit production.
    name: Version bump on addon changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need git history to diff HEAD against the PR base.
          fetch-depth: 0


      - name: Verify Minecraft Server version bumped if files changed
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}" bruh-minecraft-server


      - name: Verify brAIn version bumped if files changed
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}" brain
