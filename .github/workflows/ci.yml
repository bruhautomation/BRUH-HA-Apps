name: CI

# One gate, and it is seconds: `.github/scripts/check.py` is everything a
# change has to pass (lint, syntax, manifests, the version bump, and the
# small safety suite in tests/), and it is the same command a session runs
# locally. The two jobs beside it need tools a laptop does not have: Home
# Assistant's own integration validator, and the AppArmor parser. An
# integration hassfest refuses does not load and a profile that does not
# parse stops the add-on starting, which is why they are here and nothing
# slower is. CodeQL and Dependabot run on a schedule, never on a pull
# request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The version-bump check diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - run: pip install -q -r tests/requirements-dev.txt

      - name: Run every check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .github/scripts/check.py --base "origin/$BASE_REF"
          else
            python3 .github/scripts/check.py
          fi

  hassfest:
    name: HA integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # hassfest is what Home Assistant runs against its own integrations:
      # it validates manifest.json, services.yaml, and that every service
      # and entity string has a translation. Both custom integrations are
      # deployed by their add-on rather than through HACS, which means
      # nothing else was ever checking them.
      #
      # The integrations live under each add-on rather than in a top-level
      # custom_components/. hassfest finds them either way — it walks the
      # tree and dedupes by domain — but staging them makes the layout it
      # reports match the one the action documents, and costs a copy.
      - name: Stage integrations for hassfest
        run: |
          mkdir -p custom_components
          cp -r brain/custom_components/brain custom_components/brain
          cp -r bruh-minecraft-server/custom_components/bruh_minecraft \
                custom_components/bruh_minecraft
          cp -r bright/custom_components/bright custom_components/bright
          cp -r gardenrx/custom_components/gardenrx custom_components/gardenrx
          cp -r bruh-task-manager/custom_components/bruh_task_manager \
                custom_components/bruh_task_manager
          cp -r bruh-cooking/custom_components/bruh_cooking \
                custom_components/bruh_cooking

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master @ 2026-08-03

  apparmor:
    name: AppArmor profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install apparmor_parser
        run: |
          sudo apt-get update -q
          sudo apt-get install -y apparmor

      # A profile that doesn't parse doesn't fail at review time — it fails
      # on a user's machine, as an add-on that won't start. -Q parses and
      # validates without loading anything into the kernel.
      - name: Validate profiles
        run: |
          status=0
          for profile in brain/apparmor.txt bruh-minecraft-server/apparmor.txt bright/apparmor.txt gardenrx/apparmor.txt bruh-task-manager/apparmor.txt bruh-cooking/apparmor.txt; do
            if sudo apparmor_parser -Q -K "$profile"; then
              echo "✓ $profile"
            else
              echo "::error file=$profile::AppArmor profile does not parse"
              status=1
            fi
          done
          exit $status
