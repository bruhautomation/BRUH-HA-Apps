name: Build images

# Publishes multi-arch add-on images to GHCR.
#
# Why: right now every user builds these containers on their own Home
# Assistant box. On a Raspberry Pi that is a long, SD-card-punishing build
# that can fail on a transient network error, and the result is whatever
# each machine happened to resolve at build time. Home Assistant's
# publishing guidance is direct about it — pre-built images make "the
# installation process fast and has almost no chance of failure."
#
# Cutting over is TWO steps, deliberately:
#   1. Merge this workflow and let it publish a release. Nothing changes
#      for users yet — `config.yaml` still has no `image:`, so the
#      Supervisor keeps building locally.
#   2. Once `ghcr.io/bruhautomation/{arch}-brain:<version>` exists for
#      both architectures, add to each add-on's config.yaml:
#          image: "ghcr.io/bruhautomation/{arch}-brain"
#      and bump the version.
#
# Doing step 2 first would point every install at a tag that does not
# exist yet, and the add-on would stop installing entirely. The images
# must be on the registry before anything is told to pull them.

on:
  push:
    branches: [main]
    paths:
      - "brain/**"
      - "bruh-minecraft-server/**"
      - "bright/**"
      - "bruh-print/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      addon:
        description: "Which add-on to build (blank = both)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.addon }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: [brain, bruh-minecraft-server, bright, bruh-print]
        arch: [aarch64, amd64]

    steps:
      - uses: actions/checkout@v7

      # Skip an add-on whose files this push didn't touch, and honour the
      # manual-dispatch filter.
      - name: Decide whether to build
        id: decide
        run: |
          requested="${{ github.event.inputs.addon }}"
          if [ -n "$requested" ] && [ "$requested" != "${{ matrix.addon }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.addon }} (dispatch asked for $requested)"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Read version
        if: steps.decide.outputs.build == 'true'
        id: version
        run: |
          version=$(grep -E '^version:' "${{ matrix.addon }}/config.yaml" \
            | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not parse version from ${{ matrix.addon }}/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.addon }} $version for ${{ matrix.arch }}"

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Home Assistant builder handles the per-architecture base image,
      # the OCI labels from build.yaml, and the tagging convention the
      # Supervisor expects ({arch}-<slug>:<version> plus :latest).
      - name: Build and publish
        if: steps.decide.outputs.build == 'true'
        # NOT pinnable to a commit, and CodeQL's unpinned-tag alert for this
        # line is a false positive that has to stay. The action reads the last
        # path segment of its own checkout directory — which is whatever ref
        # it was used with — and uses that string as a *Docker image tag*:
        #
        #   input=$(echo "$GITHUB_ACTION_PATH" | rev | cut -d/ -f1 | rev)
        #   if [[ "${input}" == "master" ]]; then input="2026.02.1"; fi
        #   docker pull ghcr.io/home-assistant/amd64-builder:${input}
        #
        # So `@master` resolves to a real published builder image and a SHA
        # resolves to a tag that was never pushed — `manifest unknown`, which
        # is how all four image builds broke on main. A release tag is no help
        # either: the action's own fallback comment calls 2026.02.1 "latest
        # official release with builder image", so the newer tags have none.
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image ${{ matrix.arch }}-${{ matrix.addon }} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon

      # A private package looks exactly like a working one from in here: the
      # push succeeds, the tag exists, the job is green. It only fails on a
      # user's box, because the Supervisor pulls ANONYMOUSLY — and to them a
      # 403 is not a permissions note, it is an add-on that will not install.
      #
      # So ask the registry the same way they will. Only when config.yaml
      # actually has an `image:` key: without one the Supervisor builds
      # locally and never touches the registry, so visibility is nobody's
      # problem yet and this should not invent a failure.
      - name: Verify the image is publicly pullable
        if: steps.decide.outputs.build == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.arch }}-${{ matrix.addon }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qE '^image:' "${{ matrix.addon }}/config.yaml"; then
            echo "No image: key in ${{ matrix.addon }}/config.yaml — the Supervisor"
            echo "builds locally and never pulls, so registry visibility is moot."
            exit 0
          fi
          # No `-f`, and no `set -e` reliance, on either call. A private
          # package refuses at the *token* endpoint, so `curl -f` exited 22
          # before the message below could be printed — the check failed for
          # exactly the right reason and reported it as `curl: (22)`, which
          # tells whoever is reading the log nothing about what to do. A
          # guard whose whole value is its error message has to survive long
          # enough to print it.
          token=$(curl -sSL \
            "https://ghcr.io/token?scope=repository:${OWNER}/${IMAGE}:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' \
            2>/dev/null || true)
          if [ -z "${token}" ]; then
            code="401 (anonymous token refused)"
          else
            code=$(curl -sSL -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${OWNER}/${IMAGE}/manifests/${TAG}")
          fi
          if [ "$code" != "200" ]; then
            echo "::error::ghcr.io/${OWNER}/${IMAGE}:${TAG} answered HTTP ${code} to an anonymous pull. config.yaml points every install here, so this ships as a broken add-on. Set the package to Public at https://github.com/orgs/${OWNER}/packages"
            exit 1
          fi
          echo "ghcr.io/${OWNER}/${IMAGE}:${TAG} is publicly pullable."
