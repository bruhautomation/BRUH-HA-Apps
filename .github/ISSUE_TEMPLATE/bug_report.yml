name: Bug report
description: Report a problem with a BRUH HA add-on
labels: [bug]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Which add-on?
      options:
        - brAIn
        - BRUH Minecraft
        - BRight
        - Other / unsure
    validations:
      required: true

  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: Find this in Settings > Add-ons > (the add-on) > Info.
      placeholder: "1.9.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2025.4.1"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you actually see?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (brAIn only)
      description: >
        Run `brain report` in the Terminal tab. It writes a redacted bundle to
        `/share/brain/reports/` — versions, the run journal, the last house-checks
        pass, `brain doctor --json` and the tail of the add-on log, with every
        credential scrubbed out of all of it. Attach that file, or paste the
        JSON from Settings (⚙) > Diagnostics > "Copy for a bug report".
        It carries no prompts, no replies and no entity states.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Add-on logs
      description: Copy relevant log output. Redact tokens/credentials first.
      render: shell
