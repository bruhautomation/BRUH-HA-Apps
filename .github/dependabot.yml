version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  # The test toolchain was the one dependency set nothing was watching.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: /brain
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker


  - package-ecosystem: docker
    directory: /bruh-minecraft-server
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
