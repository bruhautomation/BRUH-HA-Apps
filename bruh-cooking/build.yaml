# Only read by Supervisor versions before 2026.04.0 — newer Supervisors
# ignore build.yaml entirely and use the Dockerfile's own ARG defaults.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24
  amd64: ghcr.io/home-assistant/amd64-base:3.24

args:
  ADDON_VERSION: "{{ version }}"

labels:
  org.opencontainers.image.title: "Home Assistant App: BRUH Cooking"
  org.opencontainers.image.description: "Breville+ and Sage cooking appliances in Home Assistant and brAIn"
  org.opencontainers.image.source: "https://github.com/bruhautomation/BRUH-HA-Apps"
  # The integration is derived from kedube/ha-breville-cooking (GPL-3.0).
  org.opencontainers.image.licenses: "GPL-3.0-only"
